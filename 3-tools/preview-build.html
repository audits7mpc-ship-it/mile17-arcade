defgame('memory','\ud83c\udccf', function(root, ctx){
  var ICONS = ['\ud83c\udf5b','\u2615','\ud83e\uded3','\ud83c\udf5b','\ud83e\udd58','\ud83c\udf36\ufe0f','\ud83e\uddc7','\ud83c\udf5a','\ud83e\udd5e','\ud83c\udf6e','\ud83e\uded6','\ud83c\udf6f'];
  var SET = ['\ud83c\udf5b','\u2615','\ud83e\uded3','\ud83e\udd58','\ud83c\udf36\ufe0f','\ud83e\uddc7','\ud83e\udd5e','\ud83c\udf6e'];
  var deck, flipped = [], matched = 0, moves = 0, lock = false;

  var wrap = h('div','g-mem');
  var hud = h('div','g-hud');
  var mv = h('span'), best = h('span');
  hud.appendChild(mv); hud.appendChild(best);
  var boardEl = h('div','mem-board');
  var again = h('button','btn-ghost', ctx.t('newGame'));
  wrap.appendChild(hud); wrap.appendChild(boardEl); wrap.appendChild(again);
  root.appendChild(wrap);

  function start(){
    deck = shuffle(SET.concat(SET)).map(function(v){ return {v:v, done:false}; });
    flipped = []; matched = 0; moves = 0; lock = false;
    render();
  }
  function render(){
    clear(boardEl);
    deck.forEach(function(card, i){
      var faceUp = card.done || flipped.indexOf(i) > -1;
      var d = h('div','mem-card' + (faceUp ? ' up' : '') + (card.done ? ' done' : ''), faceUp ? card.v : '');
      on(d,'click',function(){ flip(i); });
      boardEl.appendChild(d);
    });
    mv.textContent = ctx.t('moves') + ' ' + moves;
    best.textContent = '';
  }
  function flip(i){
    if(lock || deck[i].done || flipped.indexOf(i) > -1) return;
    SFX.flip();
    flipped.push(i); render();
    if(flipped.length < 2) return;
    moves++; lock = true;
    var a = flipped[0], b = flipped[1];
    if(deck[a].v === deck[b].v){
      SFX.correct();
      deck[a].done = deck[b].done = true; matched++;
      flipped = []; lock = false; render();
      if(matched === SET.length){
        SFX.win();
        ctx.setBest('memory', moves, true);
        setTimeout(function(){
          var ov = h('div','modal show'), card = h('div','modal-card');
          card.appendChild(h('div','modal-emoji','\ud83c\udf89'));
          card.appendChild(h('h3',null, ctx.t('youWin')));
          card.appendChild(h('p',null, ctx.t('moves') + ': ' + moves));
          var bb = h('button','btn-ghost', ctx.t('playAgain'));
          on(bb,'click',function(){ ov.remove(); start(); });
          card.appendChild(bb); ov.appendChild(card); root.appendChild(ov);
        }, 250);
      }
    } else {
      SFX.wrong();
      setTimeout(function(){ flipped = []; lock = false; render(); }, 750);
    }
  }
  on(again,'click',start);
  start();
});

/* ============ 6. MENU QUIZ ============ */
defgame('quiz','\u2753', function(root, ctx){
  var TOTAL = 10, qi = 0, score = 0, qs = [];

  function makeQuestions(){
    var out = [], used = {};
    var pool = shuffle(MENU.slice());
    while(out.length < TOTAL && pool.length > 3){
      var m = pool.pop();
      if(used[m.n]) continue;
      used[m.n] = 1;
      var dispName = ctx.mname(m.n);
      // Dishes we have no price for can still be asked about - just not
      // about their price. Never guess a number at a guest.
      var kind = Math.floor(Math.random() * (m.p ? 3 : 2));
      if(kind === 0){
        // which category
        var cats = shuffle(Array.from(new Set(MENU.map(function(x){ return x.c; })))
                    .filter(function(c){ return c !== m.c; })).slice(0,3);
        var optCats = shuffle(cats.concat([m.c])).map(function(c){ return ctx.mcat(c); });
        out.push({ q: ctx.t('whichSectionQ').replace('{d}', dispName), a: ctx.mcat(m.c),
                   o: optCats });
      } else if(kind === 1){
        // veg or not
        out.push({ q: ctx.t('isVegQ').replace('{d}', dispName), a: m.v ? ctx.t('vegLabel') : ctx.t('nonvegLabel'),
                   o: [ctx.t('vegLabel'), ctx.t('nonvegLabel')] });
      } else {
        // price bracket
        var band = function(p){ return p < 150 ? ctx.t('bandUnder150') : p < 300 ? ctx.t('band150_299')
                              : p < 500 ? ctx.t('band300_499') : ctx.t('band500plus'); };
        out.push({ q: ctx.t('roughlyCostQ').replace('{d}', dispName), a: band(m.p),
                   o: shuffle([ctx.t('bandUnder150'), ctx.t('band150_299'), ctx.t('band300_499'), ctx.t('band500plus')]) });
      }
    }
    return out;
  }

  var wrap = h('div','g-quiz');
  var hud = h('div','g-hud');
  var prog = h('span'), sc = h('span');
  hud.appendChild(prog); hud.appendChild(sc);
  var qEl = h('p','quiz-q');
  var opts = h('div','quiz-opts');
  var fb = h('p','quiz-fb','');
  wrap.appendChild(hud); wrap.appendChild(qEl); wrap.appendChild(opts); wrap.appendChild(fb);
  root.appendChild(wrap);

  function ask(){
    if(qi >= qs.length){ return finish(); }
    var q = qs[qi];
    prog.textContent = (qi+1) + ' ' + ctx.t('of') + ' ' + qs.length;
    sc.textContent = ctx.t('score') + ' ' + score;
    qEl.textContent = q.q;
    fb.textContent = ''; fb.className = 'quiz-fb';
    clear(opts);
    q.o.forEach(function(o){
      var b = h('button','quiz-opt', o);
      on(b,'click',function(){
        if(b.disabled) return;
        Array.prototype.forEach.call(opts.children, function(x){ x.disabled = true; });
        var right = o === q.a;
        if(right){ SFX.correct(); score++; b.classList.add('right'); fb.textContent = ctx.t('correct'); fb.className='quiz-fb good'; }
        else {
          SFX.wrong();
          b.classList.add('wrongo');
          Array.prototype.forEach.call(opts.children, function(x){ if(x.textContent === q.a) x.classList.add('right'); });
          fb.textContent = ctx.t('wrong'); fb.className='quiz-fb bad';
        }
        sc.textContent = ctx.t('score') + ' ' + score;
        setTimeout(function(){ qi++; ask(); }, 1100);
      });
      opts.appendChild(b);
    });
  }
  function finish(){
    ctx.setBest('quiz', score);
    if(score >= 8){ SFX.win(); } else if(score >= 5){ SFX.draw(); } else { SFX.wrong(); }
    clear(opts); qEl.textContent = '';
    prog.textContent = ''; sc.textContent = '';
    var card = h('div','quiz-done');
    card.appendChild(h('div','modal-emoji', score >= 8 ? '\ud83c\udf1f' : score >= 5 ? '\ud83d\udc4f' : '\ud83e\uddd0'));
    card.appendChild(h('h3',null, score + ' ' + ctx.t('out') + ' ' + qs.length));
    var b = h('button','btn-ghost', ctx.t('playAgain'));
    on(b,'click',start);
    card.appendChild(b);
    clear(opts); opts.appendChild(card);
  }
  function start(){ qs = makeQuestions(); qi = 0; score = 0; ask(); }
  start();
});

/* ============ 8. DISH SCRAMBLE ============ */
defgame('scramble','\ud83d\udd24', function(root, ctx){
  var word, shown, score = 0, round = 0, TOTAL = 8;
  var wrap = h('div','g-scr');
  var hud = h('div','g-hud');
  var rd = h('span'), sc = h('span');
  hud.appendChild(rd); hud.appendChild(sc);
  var letters = h('div','scr-letters');
  var slot = h('div','scr-slot');
  var fb = h('p','quiz-fb','');
  var row = h('div','pill-row');
  var bReveal = h('button','pill', ctx.t('showAnswer'));
  var bSkip = h('button','pill', ctx.t('next'));
  row.appendChild(bReveal); row.appendChild(bSkip);
  wrap.appendChild(hud); wrap.appendChild(slot); wrap.appendChild(letters);
  wrap.appendChild(fb); wrap.appendChild(row);
  root.appendChild(wrap);

  var typed = [];
  function deal(){
    if(round >= TOTAL) return finish();
    round++;
    var pool = MWORDS.filter(function(w){ return w.length >= 5 && w.length <= 8; });
    word = pick(pool);
    do { shown = shuffle(word.split('')).join(''); } while(shown === word && word.length > 2);
    typed = [];
    render();
  }
  function render(){
    rd.textContent = ctx.t('round') + ' ' + round + ' ' + ctx.t('of') + ' ' + TOTAL;
    sc.textContent = ctx.t('score') + ' ' + score;
    clear(slot);
    for(var i=0;i<word.length;i++) slot.appendChild(h('div','scr-cell', typed[i] || ''));
    clear(letters);
    var usedCount = {};
    typed.forEach(function(c){ usedCount[c] = (usedCount[c]||0) + 1; });
    var seen = {};
    shown.split('').forEach(function(c, i){
      seen[c] = (seen[c]||0) + 1;
      var isUsed = seen[c] <= (usedCount[c]||0);
      var b = h('button','scr-key' + (isUsed ? ' used' : ''), c);
      on(b,'click',function(){
        if(isUsed || typed.length >= word.length) return;
        SFX.click();
        typed.push(c); check();
      });
      letters.appendChild(b);
    });
    fb.textContent = ''; fb.className = 'quiz-fb';
  }
  function check(){
    render();
    if(typed.length < word.length) return;
    if(typed.join('') === word){
      SFX.correct();
      score++; fb.textContent = ctx.t('correct') + ' \u2014 ' + word; fb.className = 'quiz-fb good';
      setTimeout(deal, 1200);
    } else {
      SFX.wrong();
      fb.textContent = ctx.t('wrong'); fb.className = 'quiz-fb bad';
      setTimeout(function(){ typed = []; render(); }, 800);
    }
  }
  on(bReveal,'click',function(){
    SFX.pop();
    fb.textContent = word; fb.className = 'quiz-fb';
    setTimeout(deal, 1400);
  });
  on(bSkip,'click',deal);
  function finish(){
    ctx.setBest('scramble', score);
    if(score >= 6){ SFX.win(); }
    clear(wrap);
    var card = h('div','quiz-done');
    card.appendChild(h('div','modal-emoji','\ud83c\udf7d\ufe0f'));
    card.appendChild(h('h3',null, score + ' ' + ctx.t('out') + ' ' + TOTAL));
    var b = h('button','btn-ghost', ctx.t('playAgain'));
    on(b,'click',function(){ score = 0; round = 0; clear(wrap);
      wrap.appendChild(hud); wrap.appendChild(slot); wrap.appendChild(letters);
      wrap.appendChild(fb); wrap.appendChild(row); deal(); });
    card.appendChild(b); wrap.appendChild(card);
  }
  deal();
});

/* ============ 9. 2048 ============ */
defgame('twenty48','\ud83d\udd22', function(root, ctx){
  var N = 4, board, score, over;
  var wrap = h('div','g-2048');
  var hud = h('div','g-hud');
  var sc = h('span'), bs = h('span');
  hud.appendChild(sc); hud.appendChild(bs);
  var boardEl = h('div','t-board');
  var hint = h('p','g-hint','Swipe to move.');
  var again = h('button','btn-ghost', ctx.t('newGame'));
  wrap.appendChild(hud); wrap.appendChild(boardEl); wrap.appendChild(hint); wrap.appendChild(again);
  root.appendChild(wrap);

  function start(){
    board = new Array(N*N).fill(0); score = 0; over = false;
    add(); add(); render();
  }
  function add(){
    var free = [];
    for(var i=0;i<board.length;i++) if(!board[i]) free.push(i);
    if(!free.length) return;
    board[pick(free)] = Math.random() < 0.9 ? 2 : 4;
  }
  function line(arr){
    var v = arr.filter(function(x){ return x; }), out = [], i = 0;
    while(i < v.length){
      if(v[i] === v[i+1]){ out.push(v[i]*2); score += v[i]*2; i += 2; }
      else { out.push(v[i]); i++; }
    }
    while(out.length < N) out.push(0);
    return out;
  }
  function move(dir){
    if(over) return;
    var before = board.join(',');
    var scoreBefore = score;
    for(var i=0;i<N;i++){
      var idx = [];
      for(var j=0;j<N;j++){
        if(dir === 'L') idx.push(i*N + j);
        else if(dir === 'R') idx.push(i*N + (N-1-j));
        else if(dir === 'U') idx.push(j*N + i);
        else idx.push((N-1-j)*N + i);
      }
      var res = line(idx.map(function(k){ return board[k]; }));
      idx.forEach(function(k, n){ board[k] = res[n]; });
    }
    if(board.join(',') !== before){
      SFX.swipe();
      if(score > scoreBefore) SFX.correct();
      add();
    }
    render();
    if(!canMove()){ over = true; ctx.setBest('twenty48', score); SFX.lose(); render(); }
  }
  function canMove(){
    for(var i=0;i<board.length;i++){
      if(!board[i]) return true;
      var r = (i/N)|0, c = i%N;
      if(c+1 < N && board[i] === board[i+1]) return true;
      if(r+1 < N && board[i] === board[i+N]) return true;
    }
    return false;
  }
  function render(){
    clear(boardEl);
    board.forEach(function(v){
      var t = h('div','t-tile' + (v ? ' v' + Math.min(v, 2048) : ''), v ? String(v) : '');
      boardEl.appendChild(t);
    });
    sc.textContent = ctx.t('score') + ' ' + score;
    bs.textContent = '';
    hint.textContent = over ? ctx.t('gameOver') : 'Swipe to move.';
    hint.classList.toggle('bad', over);
  }
  var sx = 0, sy = 0;
  on(boardEl,'touchstart',function(e){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
  on(boardEl,'touchend',function(e){
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    e.preventDefault();
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U'));
  });
  function key(e){
    var m = {ArrowLeft:'L', ArrowRight:'R', ArrowUp:'U', ArrowDown:'D'}[e.key];
    if(m){ e.preventDefault(); move(m); }
  }
  document.addEventListener('keydown', key);
  on(again,'click',start);
  start();
  return function(){ document.removeEventListener('keydown', key); };
});

/* ============ 10. SNAKE ============ */
defgame('snake','\ud83d\udc0d', function(root, ctx){
  var N = 15, snake, dir, nextDir, food, score, timer = null, dead = false;
  // Base tick per speed, in ms. Higher = slower.
  // The original game ran at 190ms and was too quick, so every option here is
  // slower than that except Fast, which matches it for anyone who wants it back.
  var SPEEDS = { slow:420, normal:300, fast:190 };
  var speed = 'normal';
  try{ var sv = localStorage.getItem('mwp_snake_speed'); if(SPEEDS[sv]) speed = sv; }catch(e){}

  var wrap = h('div','g-snake');
  var speedRow = h('div','pill-row');
  var hud = h('div','g-hud');
  var sc = h('span'), bs = h('span');
  hud.appendChild(sc); hud.appendChild(bs);
  var boardEl = h('div','sn-board');
  var pad = h('div','sn-pad');
  var again = h('button','btn-ghost', ctx.t('newGame'));
  ['slow','normal','fast'].forEach(function(k){
    var b = h('button','pill' + (k === speed ? ' on' : ''), ctx.t(k));
    on(b,'click',function(){
      speed = k;
      try{ localStorage.setItem('mwp_snake_speed', k); }catch(e){}
      Array.prototype.forEach.call(speedRow.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      start();
    });
    speedRow.appendChild(b);
  });
  wrap.appendChild(speedRow); wrap.appendChild(hud); wrap.appendChild(boardEl);
  wrap.appendChild(pad); wrap.appendChild(again);
  root.appendChild(wrap);

  // Eases up gently as you score: 4ms per chilli, and it can never run more
  // than 30% quicker than the speed you picked.
  function delay(){
    var base = SPEEDS[speed];
    return Math.max(Math.round(base * 0.7), base - Math.floor(score / 10) * 4);
  }
  boardEl.style.gridTemplateColumns = 'repeat(' + N + ', 1fr)';

  [['\u2190','L'],['\u2191','U'],['\u2193','D'],['\u2192','R']].forEach(function(p){
    var b = h('button','sn-key', p[0]);
    on(b,'click',function(){ turn(p[1]); });
    pad.appendChild(b);
  });

  function start(){
    // Start well left of centre so a first-time player has room to react
    // before the wall, rather than dying in a couple of seconds.
    snake = [{x:3,y:7},{x:2,y:7},{x:1,y:7}];
    dir = 'R'; nextDir = 'R'; score = 0; dead = false;
    placeFood(); render();
    if(timer) clearTimeout(timer);
    timer = setTimeout(loop, delay());
  }
  function loop(){
    step();
    if(!dead) timer = setTimeout(loop, delay());
  }
  function placeFood(){
    do{ food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
    while(snake.some(function(s){ return s.x===food.x && s.y===food.y; }));
  }
  function turn(d){
    var opp = {L:'R',R:'L',U:'D',D:'U'};
    if(opp[d] === dir) return;
    nextDir = d;
  }
  function step(){
    if(dead) return;
    dir = nextDir;
    var head = {x:snake[0].x, y:snake[0].y};
    if(dir==='L') head.x--; else if(dir==='R') head.x++;
    else if(dir==='U') head.y--; else head.y++;
    if(head.x<0||head.x>=N||head.y<0||head.y>=N ||
       snake.some(function(s){ return s.x===head.x && s.y===head.y; })){
      dead = true; clearTimeout(timer); ctx.setBest('snake', score); SFX.lose(); render(); return;
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){ SFX.pop(); score += 10; placeFood(); }
    else snake.pop();
    render();
  }
  // Cells are created once; each tick only rewrites classes on the few that changed.
  var cells = [];
  (function buildBoard(){
    for(var y=0;y<N;y++) for(var x=0;x<N;x++){
      var d = h('div','sn-cell');
      cells.push(d); boardEl.appendChild(d);
    }
  })();
  var prevKeys = [];
  function render(){
    var i, k;
    for(i=0;i<prevKeys.length;i++){
      var c = cells[prevKeys[i]];
      c.className = 'sn-cell'; c.textContent = '';
    }
    prevKeys = [];
    snake.forEach(function(s, n){
      var idx = s.y*N + s.x;
      if(!cells[idx]) return;
      cells[idx].className = 'sn-cell ' + (n === 0 ? 'head' : 'body');
      prevKeys.push(idx);
    });
    var fi = food.y*N + food.x;
    if(cells[fi]){
      cells[fi].className = 'sn-cell food';
      cells[fi].textContent = '\ud83c\udf36\ufe0f';
      prevKeys.push(fi);
    }
    sc.textContent = ctx.t('score') + ' ' + score + (dead ? ' \u00b7 ' + ctx.t('gameOver') : '');
    bs.textContent = '';
  }
  function key(e){
    var m = {ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D'}[e.key];
    if(m){ e.preventDefault(); turn(m); }
  }
  document.addEventListener('keydown', key);
  var sx=0, sy=0;
  on(boardEl,'touchstart',function(e){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; });
  on(boardEl,'touchend',function(e){
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<20 && Math.abs(dy)<20) return;
    e.preventDefault();
    turn(Math.abs(dx)>Math.abs(dy) ? (dx>0?'R':'L') : (dy>0?'D':'U'));
  });
  on(again,'click',start);
  start();
  return function(){ if(timer) clearTimeout(timer); document.removeEventListener('keydown', key); };
});

/* ============ 11. TIC TAC TOE ============ */
defgame('tictactoe','\u274c', function(root, ctx){
  var b, over, msgEl;
  var WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var MARK = { X: '\ud83c\udf36\ufe0f', O: '\ud83c\udf5a' };
  var wrap = h('div','g-ttt');
  msgEl = h('p','ttt-msg','');
  var boardEl = h('div','ttt-board');
  var again = h('button','btn-ghost', ctx.t('newGame'));
  wrap.appendChild(msgEl); wrap.appendChild(boardEl); wrap.appendChild(again);
  root.appendChild(wrap);

  function winner(bd){
    for(var i=0;i<WINS.length;i++){
      var w = WINS[i];
      if(bd[w[0]] && bd[w[0]] === bd[w[1]] && bd[w[1]] === bd[w[2]]) return bd[w[0]];
    }
    return bd.indexOf('') < 0 ? 'draw' : null;
  }
  function minimax(bd, me, depth){
    var w = winner(bd);
    if(w === 'O') return {s: 10 - depth};
    if(w === 'X') return {s: depth - 10};
    if(w === 'draw') return {s: 0};
    var best = null;
    for(var i=0;i<9;i++){
      if(bd[i]) continue;
      bd[i] = me;
      var r = minimax(bd, me === 'O' ? 'X' : 'O', depth+1);
      bd[i] = '';
      if(!best || (me === 'O' ? r.s > best.s : r.s < best.s)) best = {s:r.s, i:i};
    }
    return best;
  }
  function start(){ b = new Array(9).fill(''); over = false; render(); }
  function render(){
    clear(boardEl);
    b.forEach(function(v, i){
      var c = h('div','ttt-cell' + (v ? ' f' : ''), v ? MARK[v] : '');
      on(c,'click',function(){ play(i); });
      boardEl.appendChild(c);
    });
    var w = winner(b);
    msgEl.className = 'ttt-msg';
    if(w === 'X'){ msgEl.textContent = ctx.t('youWin'); msgEl.classList.add('good'); SFX.win(); }
    else if(w === 'O'){ msgEl.textContent = ctx.t('gameOver'); msgEl.classList.add('bad'); SFX.lose(); }
    else if(w === 'draw'){ msgEl.textContent = ctx.t('draw'); SFX.draw(); }
    else msgEl.textContent = ctx.t('yourTurn');
  }
  function play(i){
    if(over || b[i]) return;
    SFX.click();
    b[i] = 'X'; render();
    if(winner(b)){ over = true; return; }
    msgEl.textContent = ctx.t('thinking');
    setTimeout(function(){
      var m = minimax(b.slice(), 'O', 0);
      if(m && m.i !== undefined) b[m.i] = 'O';
      render();
      if(winner(b)) over = true;
    }, 260);
  }
  on(again,'click',start);
  start();
});

defgame('reaction','\ud83c\udf36\ufe0f', function(root, ctx){
  var TIME = 30, GRID = 9;
  var score, left, tick = null, hop = null, at = -1, running = false;
  var wrap = h('div','g-react');
  var hud = h('div','g-hud');
  var sc = h('span'), tm = h('span');
  hud.appendChild(sc); hud.appendChild(tm);
  var boardEl = h('div','rx-board');
  var btn = h('button','btn-primary', ctx.t('play'));
  wrap.appendChild(hud); wrap.appendChild(boardEl); wrap.appendChild(btn);
  root.appendChild(wrap);

  var holes = [];
  for(var i=0;i<GRID;i++){
    (function(i){
      var d = h('div','rx-hole');
      on(d,'click',function(){ hit(i); });
      holes.push(d); boardEl.appendChild(d);
    })(i);
  }
  function paint(){
    holes.forEach(function(d, i){ d.textContent = i === at ? '\ud83c\udf36\ufe0f' : ''; d.classList.toggle('on', i === at); });
    sc.textContent = ctx.t('score') + ' ' + score;
    tm.textContent = ctx.t('time') + ' ' + left + 's';
  }
  function hit(i){
    if(!running || i !== at) return;
    SFX.pop();
    score++; at = -1; paint();
  }
  function start(){
    score = 0; left = TIME; running = true;
    btn.disabled = true; btn.textContent = '\u2026';
    function jump(){
      var n; do { n = Math.floor(Math.random()*GRID); } while(n === at);
      at = n; paint();
    }
    jump();                 // show one straight away, don't stare at an empty board
    hop = setInterval(jump, 780);
    tick = setInterval(function(){
      left--; paint();
      if(left <= 0) stop();
    }, 1000);
  }
  function stop(){
    running = false; at = -1;
    clearInterval(hop); clearInterval(tick);
    ctx.setBest('reaction', score);
    SFX.win();
    paint();
    btn.disabled = false; btn.textContent = ctx.t('playAgain');
  }
  on(btn,'click',function(){ if(!running){ SFX.click(); start(); } });
  score = 0; left = TIME; paint();
  return function(){ if(hop) clearInterval(hop); if(tick) clearInterval(tick); };
});

/* ============ 13. MENU CROSSWORD ============ */
defgame('crossword','\u270f\ufe0f', function(root, ctx){
  var KEY = 'mwp_cw_v5';
  var lang = ctx.lang, T = function(){ return CW_UI[lang] || CW_UI.en; };
  var seed, letters, revealed, finished = false;
  var P, GR, EN, NM, R, C, cellEls = {}, cur = {r:null,c:null,dir:'across'};

  try{
    var s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if(s && typeof s.seed === 'number'){ seed = s.seed; letters = s.letters||{}; revealed = s.revealed||{}; }
  }catch(e){}
  if(seed === undefined){ seed = Math.floor(Math.random()*2147483647); letters = {}; revealed = {}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify({seed:seed,letters:letters,revealed:revealed})); }catch(e){} }

  var wrap = h('div','g-cw');
  var note = h('p','cw-note','');
  var hud = h('div','g-hud');
  var solvedEl = h('span');
  hud.appendChild(solvedEl);
  var boardEl = h('div','cw-board');
  var gridEl = h('div','cw-grid');
  boardEl.appendChild(gridEl);
  var ghost = document.createElement('input');
  ghost.type='text'; ghost.className='cw-ghost'; ghost.autocomplete='off';
  ghost.setAttribute('autocorrect','off'); ghost.setAttribute('autocapitalize','characters');
  ghost.spellcheck = false;
  var clueEl = h('div','cw-clue','');
  var tools = h('div','pill-row');
  var bCheck = h('button','pill',''), bLetter = h('button','pill',''), bClear = h('button','pill','');
  tools.appendChild(bCheck); tools.appendChild(bLetter); tools.appendChild(bClear);
  var lists = h('div','cw-lists');
  var secA = h('section'), secD = h('section');
  var hA = h('h4',''), hD = h('h4','');
  var ulA = h('div','cw-ul'), ulD = h('div','cw-ul');
  secA.appendChild(hA); secA.appendChild(ulA);
  secD.appendChild(hD); secD.appendChild(ulD);
  lists.appendChild(secA); lists.appendChild(secD);
  var bNew = h('button','btn-ghost','');
  wrap.appendChild(note); wrap.appendChild(hud); wrap.appendChild(boardEl);
  wrap.appendChild(ghost); wrap.appendChild(clueEl); wrap.appendChild(tools);
  wrap.appendChild(lists); wrap.appendChild(bNew);
  root.appendChild(wrap);

  function build(){
    P = cwGenerate(CW_BANK, seed);
    GR = P.grid; EN = P.entries; NM = P.numbers; R = GR.length; C = GR[0].length;
    EN.forEach(function(e){
      var cells = [];
      for(var i=0;i<e.word.length;i++) cells.push(e.dir==='across' ? [e.row,e.col+i] : [e.row+i,e.col]);
      e.cells = cells;
    });
    cur = {r:null,c:null,dir:'across'};
  }
  function at(r,c){ return EN.filter(function(e){ return e.cells.some(function(p){ return p[0]===r&&p[1]===c; }); }); }
  function curE(){ if(cur.r===null) return null; var es=at(cur.r,cur.c);
    return es.filter(function(e){ return e.dir===cur.dir; })[0] || es[0] || null; }
  function done(e){ return e.cells.every(function(p){ return (letters[p[0]+','+p[1]]||'')===GR[p[0]][p[1]]; }); }
  function nextOpen(from){
    var i = EN.indexOf(from);
    for(var n=1;n<=EN.length;n++){ var e = EN[(i+n)%EN.length]; if(!done(e)) return e; }
    return null;
  }
  function size(){
    var avail = Math.min(wrap.clientWidth || 340, 460);
    var cell = Math.max(15, Math.min(Math.floor((avail - 20 - (C-1)) / C), 32));
    gridEl.style.gridTemplateColumns = 'repeat(' + C + ', ' + cell + 'px)';
    wrap.style.setProperty('--cwcell', cell + 'px');
  }
  function draw(){
    clear(gridEl); cellEls = {};
    for(var r=0;r<R;r++) for(var c=0;c<C;c++){
      var d = h('div','cw-cell');
      if(GR[r][c]){
        d.classList.add('open');
        var n = NM[r+','+c];
        if(n) d.appendChild(h('span','cw-num', n));
        d.appendChild(h('span','cw-ch',''));
        (function(rr,cc){ on(d,'click',function(){ tap(rr,cc); }); })(r,c);
        cellEls[r+','+c] = d;
      }
      gridEl.appendChild(d);
    }
    size();
  }
  function drawClues(){
    [['across',ulA],['down',ulD]].forEach(function(pair){
      clear(pair[1]);
      EN.filter(function(e){ return e.dir===pair[0]; }).forEach(function(e){
        var li = h('div','cw-li');
        li.dataset.k = e.dir + e.num;
        li.appendChild(h('b',null, String(e.num)));
        li.appendChild(h('span','ct', e.clue[lang] || e.clue.en));
        li.appendChild(h('i','nat',''));
        on(li,'click',function(){
          cur = {r:e.row,c:e.col,dir:e.dir};
          paint(); boardEl.scrollIntoView({behavior:'smooth',block:'center'});
          requestAnimationFrame(focusIn);
        });
        pair[1].appendChild(li);
      });
    });
  }
  function labels(){
    var t = T();
    note.textContent = t.typeNote;
    hA.textContent = t.across; hD.textContent = t.down;
    bCheck.textContent = t.check; bLetter.textContent = t.reveal; bClear.textContent = t.clear;
    bNew.textContent = t.newPuzzle;
  }
  function paint(){
    var e = curE();
    var inE = e ? e.cells.map(function(p){ return p.join(','); }) : [];
    Object.keys(cellEls).forEach(function(k){
      var d = cellEls[k], p = k.split(','), rr=+p[0], cc=+p[1];
      d.querySelector('.cw-ch').textContent = letters[k] || '';
      d.classList.toggle('in', inE.indexOf(k) > -1);
      d.classList.toggle('cur', cur.r===rr && cur.c===cc);
      d.classList.toggle('lock', !!revealed[k]);
      d.classList.remove('bad');
    });
    clear(clueEl);
    if(e){
      clueEl.appendChild(h('span','k', e.num + ' ' + (e.dir==='across' ? T().across : T().down)));
      clueEl.appendChild(document.createTextNode(' \u00b7 ' + (e.clue[lang] || e.clue.en)));
    } else clueEl.textContent = T().tapBegin;
    var n = 0;
    EN.forEach(function(en){
      var li = wrap.querySelector('[data-k="' + en.dir + en.num + '"]');
      var ok = done(en); if(ok) n++;
      if(li){
        li.classList.toggle('done', ok);
        li.classList.toggle('sel', e === en);
        li.querySelector('.nat').textContent =
          (ok && lang !== 'en' && en.native && en.native[lang]) ? '  \u00b7  ' + en.native[lang] : '';
      }
    });
    solvedEl.textContent = ctx.t('found') + ' ' + n + ' ' + ctx.t('of') + ' ' + EN.length;
    if(n === EN.length && !finished){ finished = true; SFX.win(); win(); }
  }
  function win(){
    var ov = h('div','modal show'), card = h('div','modal-card');
    card.appendChild(h('div','modal-emoji','\ud83c\udf7d\ufe0f'));
    card.appendChild(h('h3',null, T().doneTitle + EN.length));
    var g = Object.keys(revealed).length;
    card.appendChild(h('p',null, g ? T().doneHelped.replace('{t}','').replace('{n}', g + ' ' + (g===1?T().letter:T().letters))
                                   : T().doneClean.replace('{t}','')));
    var b1 = h('button','btn-ghost', T().close), b2 = h('button','btn-ghost', T().another);
    on(b1,'click',function(){ ov.remove(); });
    on(b2,'click',function(){ ov.remove(); fresh(); });
    var row = h('div','modal-row'); row.appendChild(b1); row.appendChild(b2);
    card.appendChild(row); ov.appendChild(card); root.appendChild(ov);
  }
  function focusIn(){
    var d = cellEls[cur.r + ',' + cur.c];
    if(d){ var b = d.getBoundingClientRect(); ghost.style.left = b.left+'px'; ghost.style.top = b.top+'px'; }
    ghost.value = '';
    try{ ghost.focus({preventScroll:true}); }catch(err){ ghost.focus(); }
  }
  function tap(r,c){
    var es = at(r,c);
    if(cur.r===r && cur.c===c){ if(es.length>1) cur.dir = cur.dir==='across'?'down':'across'; }
    else cur = {r:r,c:c,dir: es.some(function(e){ return e.dir===cur.dir; }) ? cur.dir : es[0].dir};
    paint(); focusIn();
  }
  function type(ch){
    if(cur.r===null) return;
    SFX.click();
    var k = cur.r+','+cur.c;
    if(!revealed[k]) letters[k] = ch;
    var e = curE();
    if(e){
      var cs = e.cells, i = -1, x;
      for(x=0;x<cs.length;x++) if(cs[x][0]===cur.r && cs[x][1]===cur.c){ i=x; break; }
      var j = -1;
      for(x=i+1;x<cs.length;x++) if(!letters[cs[x].join(',')]){ j=x; break; }
      if(j===-1 && i < cs.length-1) j = i+1;
      if(j>-1){ cur.r=cs[j][0]; cur.c=cs[j][1]; }
      else if(done(e)){ SFX.correct(); var nx = nextOpen(e); if(nx) cur = {r:nx.row,c:nx.col,dir:nx.dir}; }
    }
    save(); paint(); focusIn();
  }
  function back(){
    if(cur.r===null) return;
    var k = cur.r+','+cur.c;
    if(letters[k] && !revealed[k]) delete letters[k];
    else {
      var e = curE();
      if(e){
        var cs = e.cells, i=-1;
        for(var x=0;x<cs.length;x++) if(cs[x][0]===cur.r&&cs[x][1]===cur.c){ i=x; break; }
        if(i>0){ cur.r=cs[i-1][0]; cur.c=cs[i-1][1];
                 var k2=cur.r+','+cur.c; if(!revealed[k2]) delete letters[k2]; }
      }
    }
    save(); paint(); focusIn();
  }
  function arrow(dr,dc){
    if(cur.r===null) return;
    var want = dr ? 'down' : 'across';
    if(cur.dir !== want && at(cur.r,cur.c).some(function(e){ return e.dir===want; })){ cur.dir=want; paint(); return; }
    var r=cur.r+dr, c=cur.c+dc;
    while(r>=0&&r<R&&c>=0&&c<C){ if(GR[r][c]){ cur.r=r; cur.c=c; break; } r+=dr; c+=dc; }
    paint(); focusIn();
  }
  on(ghost,'beforeinput',function(ev){
    if(ev.inputType === 'deleteContentBackward'){ ev.preventDefault(); back(); }
  });
  on(ghost,'input',function(ev){
    var v = (ev.target.value||'').replace(/[^a-zA-Z]/g,'').toUpperCase();
    ev.target.value = '';
    for(var i=0;i<v.length;i++) type(v[i]);
  });
  function key(ev){
    if(ev.key==='Backspace'){ ev.preventDefault(); back(); return; }
    if(ev.key==='ArrowRight'){ ev.preventDefault(); arrow(0,1); return; }
    if(ev.key==='ArrowLeft'){ ev.preventDefault(); arrow(0,-1); return; }
    if(ev.key==='ArrowDown'){ ev.preventDefault(); arrow(1,0); return; }
    if(ev.key==='ArrowUp'){ ev.preventDefault(); arrow(-1,0); return; }
    if(/^[a-zA-Z]$/.test(ev.key) && document.activeElement !== ghost){ ev.preventDefault(); type(ev.key.toUpperCase()); }
  }
  document.addEventListener('keydown', key);
  window.addEventListener('resize', size);

  var flashT = null;
  on(bCheck,'click',function(){
    var wrong = 0;
    Object.keys(letters).forEach(function(k){
      var p=k.split(','), rr=+p[0], cc=+p[1];
      if(!GR[rr]||!GR[rr][cc]) return;
      if(letters[k] && letters[k] !== GR[rr][cc]){ if(cellEls[k]) cellEls[k].classList.add('bad'); wrong++; }
    });
    if(wrong){ SFX.error(); } else { SFX.correct(); }
    clear(clueEl);
    clueEl.appendChild(h('span','k', wrong ? (wrong + ' ' + (wrong===1?T().toFix1:T().toFix2)) : T().allClear));
    clueEl.appendChild(document.createTextNode(' \u00b7 ' + (wrong ? T().toFixBody : T().allClearBody)));
    if(!wrong){ clearTimeout(flashT); flashT = setTimeout(paint, 2400); }
  });
  on(bLetter,'click',function(){
    if(cur.r===null) return;
    SFX.pop();
    var k = cur.r+','+cur.c;
    revealed[k] = true; letters[k] = GR[cur.r][cur.c]; save(); type(letters[k]);
  });
  on(bClear,'click',function(){
    var e = curE(); if(!e) return;
    SFX.back();
    e.cells.forEach(function(p){ var k=p[0]+','+p[1]; if(!revealed[k]) delete letters[k]; });
    cur.r = e.cells[0][0]; cur.c = e.cells[0][1];
    save(); paint(); focusIn();
  });
  function fresh(){
    if(Object.keys(letters).length && !window.confirm(T().confirmNew)) return;
    SFX.click();
    seed = Math.floor(Math.random()*2147483647); letters = {}; revealed = {}; finished = false;
    save(); build(); draw(); drawClues(); paint();
  }
  on(bNew,'click',fresh);

  labels(); build(); draw(); drawClues(); paint();
  return function(){ document.removeEventListener('keydown', key); window.removeEventListener('resize', size); };
});

    gname: function(id){ return (G[id][lang] || G[id].en)[0]; },
    gdesc: function(id){ return (G[id][lang] || G[id].en)[1]; },
    mname: function(n){ return (NAME_TR[n] && NAME_TR[n][lang]) || n; },
    mcat: function(c){ return (CAT_TR[c] && CAT_TR[c][lang]) || c; },
    /* Scores are not kept between visits. Every guest starts the games on a
       level field and is never shown what anyone managed before. */
    best: function(){ return 0; },
    setBest: function(){ return false; },
    table: table, outlet: outlet,
    prizeGame: function(){ return prizeAvailable(); },
    // let a game offer the others once it is finished
    enabledGames: function(){ return visibleGames(); },
    openGame: function(id){ if(GAMES[id]) openGame(id); },
    h:h, on:on, clear:clear, shuffle:shuffle, pick:pick
  };

  /* ---------- language ---------- */
  function paintLang(){
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('.lang-pill[data-lang]'), function(b){
      b.classList.toggle('on', b.dataset.lang === lang);
    });
  }
  function paintSnd(){
    var b = el('sndBtn');
    if(!b) return;
    b.textContent = sfxOn ? '\uD83D\uDD0A' : '\uD83D\uDD07';
    b.classList.toggle('on', sfxOn);
    b.setAttribute('aria-pressed', sfxOn ? 'true' : 'false');
  }

  /* Each guest is dealt one prize game for their 24 hours. The other one
     never appears - not on the hub, not in the tail of a finished game. */
  function visibleGames(){
    return ORDER.filter(function(id){
      if(enabled.indexOf(id) < 0) return false;
      if(PASS.isPrizeGame(id) && !PREVIEW) return false;  // reached only through the go banner
      return true;
    });
  }
  // The prize game this guest was dealt, if the staff link has it switched on.
  function prizeAvailable(){
    var mine = PASS.game();
    return (mine && enabled.indexOf(mine) > -1) ? mine : null;
  }

  /* ---------- hub ---------- */
  function showHub(){
    if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
    current = null;
    el('gameScreen').hidden = true;
    el('hub').hidden = false;
    el('backBtn').hidden = true;
    el('hubTitle').textContent = ctx.t('arcade');
    el('hubSub').textContent = ctx.t('arcadeSub');
    el('tableTag').textContent = table ? ('Table ' + table + (outlet ? ' \u00b7 ' + outlet : '')) : '';

    var list = el('gameList');
    clear(list);
    paintPassNote();
    var shown = visibleGames();
    if(!shown.length){ list.appendChild(h('p','empty', ctx.t('noGames'))); return; }

    shown.forEach(function(id, idx){
      var card = h('button','card');
      card.style.animationDelay = (idx * 0.035) + 's';
      card.appendChild(h('div','card-icon', GAMES[id].icon));
      var body = h('div','card-body');
      body.appendChild(h('div','card-name', ctx.gname(id)));
      body.appendChild(h('div','card-desc', ctx.gdesc(id)));
      card.appendChild(body);
      on(card, 'click', function(){ SFX.select(); openGame(id); });
      list.appendChild(card);
    });
    el('adminBtn').hidden = !isAdmin;
    var hubEl = el('hub');
    hubEl.classList.remove('fx-in'); void hubEl.offsetWidth; hubEl.classList.add('fx-in');
  }

  function paintPassNote(){
    var host = el('hub');
    Array.prototype.forEach.call(host.querySelectorAll('.pass-note'), function(n){ n.remove(); });
    var T = prizeT(lang), res = PASS.result(), mine = prizeAvailable();

    if(res && res.won){
      var note = h('div','pass-note');
      note.appendChild(h('div','pn-gift', PRIZE_EMOJI));
      var body = h('div','pn-body');
      body.appendChild(h('div','pn-t', T.rewardTitle));
      body.appendChild(h('div','pn-s', T.share));
      note.appendChild(body);
      host.insertBefore(note, el('gameList'));
      return;
    }
    // Their go is not on the game list, so this is the only door to it.
    if(mine && !PASS.finished()){
      var started = PASS.started();
      var go = h('button','pass-note pass-go');
      go.appendChild(h('div','pn-gift', PRIZE_EMOJI));
      var gb = h('div','pn-body');
      gb.appendChild(h('div','pn-t', started ? T.goFinish : T.goWaiting));
      gb.appendChild(h('div','pn-s', started
        ? (T.goes + ': ' + PASS.triesLeft())
        : T.goSub));
      go.appendChild(gb);
      go.appendChild(h('span','pn-go', T.playWin));
      on(go,'click',function(){ SFX.select(); openGame(mine); });
      host.insertBefore(go, el('gameList'));
    }
  }

  function openGame(id){
    if(cleanup){ try{ cleanup(); }catch(e){} cleanup = null; }
    current = id;
    el('hub').hidden = true;
    el('gameScreen').hidden = false;
    el('backBtn').hidden = false;
    el('gameTitle').textContent = ctx.gname(id);
    var stage = el('stage');
    clear(stage);
    try{
      cleanup = GAMES[id].mount(stage, ctx) || null;
    }catch(err){
      clear(stage);
      stage.appendChild(h('p','empty','Something went wrong loading this game.'));
      if(window.console) console.error(err);
    }
    window.scrollTo({top:0, behavior:'auto'});
    var gsEl = el('gameScreen');
    gsEl.classList.remove('fx-in'); void gsEl.offsetWidth; gsEl.classList.add('fx-in');
  }

  /* ---------- staff panel ---------- */
  function showAdmin(){
    var ov = el('adminOverlay');
    var list = el('adminList');
    clear(list);
    ORDER.forEach(function(id){
      var row = h('label','arow');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = enabled.indexOf(id) > -1; cb.dataset.id = id;
      row.appendChild(cb);
      row.appendChild(h('span','aicon', GAMES[id].icon));
      row.appendChild(h('span','aname', ctx.gname(id)));
      on(cb, 'change', function(){
        SFX.toggle();
        enabled = Array.prototype.filter.call(list.querySelectorAll('input'), function(x){ return x.checked; })
                  .map(function(x){ return x.dataset.id; });
        save(); paintLink();
      });
      list.appendChild(row);
    });
    el('adminTitle').textContent = ctx.t('settings');
    el('adminHint').textContent = ctx.t('chooseGames');
    el('adminNote').textContent = ctx.t('linkNote');
    el('adminCopy').textContent = ctx.t('copyLink');
    el('adminClose').textContent = ctx.t('close');
    paintLink();
    ov.classList.add('show');
  }
  function buildLink(){
    var base = location.origin + location.pathname;
    var q = [];
    if(table)  q.push('table='  + encodeURIComponent(table));
    if(outlet) q.push('outlet=' + encodeURIComponent(outlet));
    q.push('games=' + enabled.join(','));
    return base + '?' + q.join('&');
  }
  function paintLink(){ el('adminLink').value = buildLink(); }

  on(el('adminBtn'), 'click', function(){ SFX.click(); showAdmin(); });
  on(el('adminClose'), 'click', function(){ SFX.back(); el('adminOverlay').classList.remove('show'); showHub(); });
  on(el('adminCopy'), 'click', function(){
    SFX.pop();
    var f = el('adminLink');
    f.select(); f.setSelectionRange(0, 99999);
    var done = function(){ el('adminCopy').textContent = ctx.t('copied');
      setTimeout(function(){ el('adminCopy').textContent = ctx.t('copyLink'); }, 1600); };
    if(navigator.clipboard){ navigator.clipboard.writeText(f.value).then(done, done); }
    else { try{ document.execCommand('copy'); }catch(e){} done(); }
  });

  on(el('backBtn'), 'click', function(){ SFX.back(); showHub(); });
  Array.prototype.forEach.call(document.querySelectorAll('.lang-pill[data-lang]'), function(b){
    on(b, 'click', function(){
      if(b.dataset.lang === lang) return;
      SFX.click();
      lang = b.dataset.lang; save(); paintLang();
      if(current) openGame(current); else showHub();
    });
  });
  on(el('sndBtn'), 'click', function(){
    sfxOn = !sfxOn; SFX.setEnabled(sfxOn); save(); paintSnd();
    if(sfxOn) SFX.click();
  });

  /* A strip along the bottom for walking through every branch without
     waiting for a new day or a lucky draw. Preview builds only. */
  function paintPreviewBar(){
    if(!PREVIEW) return;
    document.body.classList.add('pv-on');
    var old = document.querySelector('.pv-bar');
    if(old) old.remove();
    var bar = h('div','pv-bar');
    function group(label, key, opts){
      bar.appendChild(h('span', null, label));
      opts.forEach(function(o){
        var btn = h('button', PV.get(key) === o[0] ? 'on' : '', o[1]);
        on(btn,'click',function(){ PV.set(key, o[0]); });
        bar.appendChild(btn);
      });
    }
    bar.appendChild(h('b', null, 'PV'));
    group('deal', 'game', [['','auto'],['spin','slot'],['wheel','wheel']]);
    group('result', 'outcome', [['draw','1/50'],['win','win'],['lose','miss']]);
    var again = h('button','', '\u21bb');
    again.title = 'replay from the top';
    on(again,'click',function(){ location.href = location.pathname + location.search; });
    bar.appendChild(again);
    document.body.appendChild(bar);
  }

  /* ---------- go ---------- */
  load();
  save();                    // rewrites the record without any old best scores
  SFX.setEnabled(sfxOn);
  paintLang();
  paintSnd();
  window.ARCADE = ctx;
  PASS.ready(function(){ showHub(); paintPreviewBar(); });
})();

</script>

<style>

  -webkit-user-select:none; user-select:none; touch-action:manipulation;

#mwHalo{

#mwSplash{
  position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
  animation:mwLogoIn .85s cubic-bezier(.2,.8,.3,1) both;
}
#mwSplash img{
  width:112px; height:auto; display:block;
  animation:mwPulse 2.1s ease-in-out infinite;
}
#mwSplash.mw-out{ animation:mwLogoOut .45s ease forwards; }
@keyframes mwLogoIn{ from{ opacity:0; transform:translate(-50%,-50%) scale(.9); } to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
@keyframes mwLogoOut{ to{ opacity:0; transform:translate(-50%,-50%) scale(1.06); } }
@keyframes mwPulse{ 0%,100%{ filter:drop-shadow(0 0 12px rgba(255,236,214,.38)) drop-shadow(0 0 34px rgba(239,78,34,.26)); }
                    50%{ filter:drop-shadow(0 0 22px rgba(255,244,232,.78)) drop-shadow(0 0 60px rgba(239,78,34,.52)); } }

/* ---- stage 2: the Mile 17 panel ---- */
#mwPanel{
  position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center;
  max-width:420px; margin:0 auto; padding:0 26px; pointer-events:none;
}
#mwPanel .mw-on{ pointer-events:auto; }
.mw-head{ display:flex; align-items:center; gap:22px; }
.mw-badge{
  display:block; width:140px; height:auto; flex:0 0 auto;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.55));
  opacity:0; transform:translateY(14px) scale(.9);
}
.mw-badge.mw-show{ animation:mwBadgeIn .85s cubic-bezier(.2,1.12,.4,1) forwards; }
@keyframes mwBadgeIn{ to{ opacity:1; transform:translateY(0) scale(1); } }
.mw-years{
  font-family:var(--sans); font-size:11.5px; letter-spacing:2.2px; line-height:1.9;
  color:var(--m17-teal-lt); text-transform:uppercase;
  opacity:0; transform:translateY(6px);
}

/* the road the badge sits on — centre-line markings running off to the right */
.mw-road{
  position:relative; height:4px; margin:11px -26px 32px 0; border-radius:3px;
  opacity:0; transition:opacity 1s ease;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.58) 0 22px,rgba(255,255,255,0) 22px 42px);
  -webkit-mask-image:linear-gradient(90deg,#000 0%,#000 46%,rgba(0,0,0,.25) 78%,transparent 100%);
  mask-image:linear-gradient(90deg,#000 0%,#000 46%,rgba(0,0,0,.25) 78%,transparent 100%);
}
.mw-road.mw-show{ opacity:1; }

.mw-word{
  font-family:var(--ui); font-style:italic; font-weight:700; font-size:27px; line-height:1.1;
  color:var(--m17-orange-lt); text-shadow:0 0 26px rgba(239,78,34,.45);
  margin-bottom:10px; min-height:34px;
  opacity:0; transform:translateY(8px); transition:opacity .42s ease, transform .42s ease;
}
.mw-guests{
  font-family:var(--sans); font-size:13.5px; line-height:1.6; color:#c3d4cf;
  margin-bottom:26px; opacity:0; transform:translateY(8px);
}
.mw-invite{
  font-family:var(--ui); font-weight:700; font-size:17.5px; line-height:1.62; color:#fff;
  margin-bottom:24px; opacity:0; transform:translateY(8px);
}
#mwCta{
  position:relative; overflow:hidden; width:100%; display:flex; align-items:center;
  justify-content:space-between; gap:12px;
  background:linear-gradient(180deg,#ff7a4a 0%,#ef4e22 58%,#d63d13 100%);
  border:none; border-radius:14px; padding:17px 22px;
  font-family:var(--ui); font-size:16.5px; font-weight:700; color:#fff;
  box-shadow:0 8px 26px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28);
  opacity:0; transform:translateY(10px);
}
#mwCta .mw-arrow{ font-size:18px; line-height:1; opacity:.85; }
#mwCta::after{
  content:""; position:absolute; top:0; bottom:0; width:38%;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.42),rgba(255,255,255,0));
  transform:translateX(-160%) skewX(-18deg); animation:mwShine 3.4s ease-in-out 1.2s infinite;
}
@keyframes mwShine{ 0%{ transform:translateX(-160%) skewX(-18deg); } 55%,100%{ transform:translateX(420%) skewX(-18deg); } }
#mwCta:active{ transform:translateY(12px) scale(.985); }
#mwCta:focus-visible{ outline:2px solid #fff; outline-offset:3px; }

.mw-rise{ animation:mwRise .6s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes mwRise{ to{ opacity:1; transform:translateY(0); } }

@media (max-height:640px){
  #mwSplash img{ width:92px; }
  .mw-badge{ width:108px; }
  .mw-road{ margin:9px -26px 24px 0; }
  .mw-word{ font-size:24px; } .mw-invite{ font-size:16.5px; margin-bottom:20px; }
  .mw-guests{ margin-bottom:20px; }
}
@media (prefers-reduced-motion:reduce){
  #mwHalo,#mwSplash img,#mwCta::after{ animation:none !important; }
}
</style>

<script>
(function(){
  'use strict';
  var el = function(id){ return document.getElementById(id); };
  var root = el('mwIntro');
  if(!root) return;

  try{
    if(new URLSearchParams(location.search).get('intro') === '0'){ root.parentNode.removeChild(root); return; }
  }catch(e){}

  var REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* The opening film is a once-a-day thing. Someone who scans the QR again
     over lunch goes straight to the arcade instead of sitting through it. */
  function dropIntro(){
    document.documentElement.style.overflow = '';
    if(root.parentNode) root.parentNode.removeChild(root);
  }

  /* ---------- copy, in the three arcade languages ---------- */
  var TXT = {
    en:{ years:'Years on the<br>highway',
         words:['Recharge','Restart','Refresh'],
         guests:'more than 10 million guests so far, and counting.',
         invite:'Glad you pulled over \u2728<br>a little something to play while you wait.',
         cta:'Play &amp; Win' },
    te:{ years:'\u0c39\u0c48\u0c35\u0c47\u0c2a\u0c48<br>\u0c0f\u0c33\u0c4d\u0c32\u0c41\u0c17\u0c3e',
         words:['\u0c30\u0c40\u0c1b\u0c3e\u0c30\u0c4d\u0c1c\u0c4d','\u0c30\u0c40\u0c38\u0c4d\u0c1f\u0c3e\u0c30\u0c4d\u0c1f\u0c4d','\u0c30\u0c3f\u0c2b\u0c4d\u0c30\u0c46\u0c37\u0c4d'],
         guests:'\u0c07\u0c2a\u0c4d\u0c2a\u0c1f\u0c3f\u0c35\u0c30\u0c15\u0c41 \u0c15\u0c4b\u0c1f\u0c3f \u0c2e\u0c02\u0c26\u0c3f\u0c15\u0c3f \u0c2a\u0c48\u0c17\u0c3e \u0c05\u0c24\u0c3f\u0c25\u0c41\u0c32\u0c41 \u2014 \u0c07\u0c02\u0c15\u0c3e \u0c15\u0c4a\u0c28\u0c38\u0c3e\u0c17\u0c41\u0c24\u0c42\u0c28\u0c47 \u0c09\u0c02\u0c26\u0c3f.',
         invite:'\u0c2e\u0c40\u0c30\u0c41 \u0c06\u0c17\u0c3f\u0c28\u0c02\u0c26\u0c41\u0c15\u0c41 \u0c38\u0c02\u0c24\u0c4b\u0c37\u0c02 \u2728<br>\u0c2d\u0c4b\u0c1c\u0c28\u0c02 \u0c35\u0c1a\u0c4d\u0c1a\u0c47\u0c32\u0c4b\u0c2a\u0c41 \u0c06\u0c21\u0c41\u0c15\u0c4b\u0c35\u0c21\u0c3e\u0c28\u0c3f\u0c15\u0c3f \u0c15\u0c3e\u0c38\u0c4d\u0c24.',
         cta:'\u0c06\u0c21\u0c02\u0c21\u0c3f &amp; \u0c17\u0c46\u0c32\u0c35\u0c02\u0c21\u0c3f' },
    hi:{ years:'\u0938\u093e\u0932<br>\u0939\u093e\u0908\u0935\u0947 \u092a\u0930',
         words:['\u0930\u0940\u091a\u093e\u0930\u094d\u091c','\u0930\u0940\u0938\u094d\u091f\u093e\u0930\u094d\u091f','\u0930\u093f\u092b\u094d\u0930\u0947\u0936'],
         guests:'\u0905\u092c \u0924\u0915 1 \u0915\u0930\u094b\u0921\u093c \u0938\u0947 \u095b\u094d\u092f\u093e\u0926\u093e \u092e\u0947\u0939\u092e\u093e\u0928 \u2014 \u0914\u0930 \u0917\u093f\u0928\u0924\u0940 \u091c\u093e\u0930\u0940 \u0939\u0948.',
         invite:'\u0905\u091a\u094d\u091b\u093e \u0939\u0941\u0906 \u0906\u092a \u0930\u0941\u0915\u0947 \u2728<br>\u0916\u093e\u0928\u093e \u0906\u0928\u0947 \u0924\u0915 \u0916\u0947\u0932\u0928\u0947 \u0915\u0947 \u0932\u093f\u090f \u0915\u0941\u091b\u0964',
         cta:'\u0916\u0947\u0932\u0947\u0902 \u0914\u0930 \u091c\u0940\u0924\u0947\u0902' }
  };
  var lang = 'en';
  try{
    var saved = JSON.parse(localStorage.getItem('mwp_arcade_v1') || 'null');
    if(saved && TXT[saved.lang]) lang = saved.lang;
    else {
      var n = (navigator.language || 'en').toLowerCase();
      if(n.indexOf('te') === 0) lang = 'te'; else if(n.indexOf('hi') === 0) lang = 'hi';
    }
  }catch(e){}
  var L = TXT[lang];

  el('mwYears').innerHTML    = L.years;
  el('mwGuests').textContent = L.guests;
  el('mwInvite').innerHTML   = L.invite;
  el('mwCtaText').innerHTML  = L.cta;

  var brandImg = document.querySelector('.brand img');
  if(brandImg) el('mwLogoImg').src = brandImg.getAttribute('src');

  /* ================= road dust + burst ================= */
  var fx = el('mwFx'), g = fx.getContext('2d'), W = 0, H = 0, dpr = 1;
  var motes = [], burst = [], flash = 0;
  var SPARK = ['#ff7a44','#ef4e22','#ffffff','#5fc2a8'];

  function sizeFx(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = root.clientWidth; H = root.clientHeight;
    fx.width = Math.round(W*dpr); fx.height = Math.round(H*dpr);
    g.setTransform(dpr,0,0,dpr,0,0);
  }
  sizeFx();

  function seedMotes(){
    motes = [];
    var n = REDUCED ? 0 : Math.round(Math.min(40, Math.max(18, W*H/26000)));
    for(var i=0;i<n;i++){
      motes.push({
        x:Math.random()*W, y:Math.random()*H,
        r:0.6 + Math.random()*2.0,
        vy:-(0.10 + Math.random()*0.32),
        vx:(Math.random()-0.35)*0.16,
        a:0.10 + Math.random()*0.42,
        ph:Math.random()*6.28, sw:0.3 + Math.random()*0.8,
        col:Math.random() < 0.6 ? '#f0764a' : (Math.random() < 0.5 ? '#ffffff' : '#69c4ab'),
        long:Math.random() < 0.35
      });
    }
  }
  seedMotes();

  function makeBurst(cx, cy){
    if(REDUCED) return;
    burst = [];
    for(var i=0;i<180;i++){
      var ang = Math.random()*6.2832, sp = 1.2 + Math.random()*9.4;
      burst.push({
        x:cx + (Math.random()-0.5)*14, y:cy + (Math.random()-0.5)*14,
        vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp - 0.5,
        life:0, max:1100 + Math.random()*1300,
        w:1.6 + Math.random()*4.2, h:1.0 + Math.random()*2.6,
        rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.22,
        hue:SPARK[Math.floor(Math.random()*SPARK.length)]
      });
    }
    flash = 1;
  }

  var last = 0, raf;
  function frame(now){
    if(!last) last = now;
    var dt = Math.min(48, now - last); last = now;

    g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,fx.width,fx.height); g.setTransform(dpr,0,0,dpr,0,0);

    if(flash > 0){
      flash = Math.max(0, flash - dt/380);
      var rr = (1-flash)*Math.max(W,H)*0.55;
      var rg = g.createRadialGradient(W/2,H*0.44,rr*0.55,W/2,H*0.44,rr);
      rg.addColorStop(0,'rgba(255,150,90,0)');
      rg.addColorStop(.8,'rgba(255,150,90,'+(flash*0.12)+')');
      rg.addColorStop(1,'rgba(255,150,90,0)');
      g.fillStyle = rg; g.fillRect(0,0,W,H);
    }

    var i, p;
    for(i=0;i<motes.length;i++){
      p = motes[i];
      p.ph += dt*0.0013*p.sw;
      p.x += p.vx*dt*0.06 + Math.sin(p.ph)*0.13;
      p.y += p.vy*dt*0.06;
      if(p.y < -12){ p.y = H + 10; p.x = Math.random()*W; }
      if(p.x < -12) p.x = W + 10; else if(p.x > W + 12) p.x = -10;
      g.globalAlpha = p.a * (0.72 + 0.28*Math.sin(p.ph*1.7));
      g.fillStyle = p.col;
      g.beginPath();
      if(p.long) g.ellipse(p.x, p.y, p.r*0.55, p.r*1.9, 0.5, 0, 6.2832);
      else g.arc(p.x, p.y, p.r, 0, 6.2832);
      g.fill();
    }

    for(i=burst.length-1;i>=0;i--){
      p = burst[i];
      p.life += dt;
      if(p.life > p.max){ burst.splice(i,1); continue; }
      var t = p.life/p.max, damp = Math.pow(0.965, dt/16);
      p.vx *= damp; p.vy = p.vy*damp + 0.020*dt/16;
      p.x += p.vx*dt/16; p.y += p.vy*dt/16; p.rot += p.vr*dt/16;
      g.globalAlpha = (1-t)*(1-t)*0.95;
      g.fillStyle = p.hue;
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot);
      g.beginPath(); g.ellipse(0,0,p.w,p.h,0,0,6.2832); g.fill();
      g.restore();
    }
    g.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  window.addEventListener('resize', function(){ sizeFx(); seedMotes(); });

  /* ================= the word that keeps changing ================= */
  var wordEl = el('mwWord'), wi = 0, wordTimer = null;
  function rotateWord(){
    wordEl.style.opacity = '0';
    wordEl.style.transform = 'translateY(-6px)';
    setTimeout(function(){
      wi = (wi + 1) % L.words.length;
      wordEl.textContent = L.words[wi];
      wordEl.style.transform = 'translateY(6px)';
      requestAnimationFrame(function(){
        wordEl.style.opacity = '1';
        wordEl.style.transform = 'translateY(0)';
      });
    }, 430);
  }

  /* ================= timeline ================= */
  function rise(node, delay){ setTimeout(function(){ node.classList.add('mw-rise'); }, delay); }
  var timers = [];
  function at(ms, fn){ timers.push(setTimeout(fn, REDUCED ? Math.min(ms, 60) : ms)); }

  var splash = el('mwSplash');

  function runIntro(){
  at(2000, function(){
    var b = splash.getBoundingClientRect();
    makeBurst(b.left + b.width/2, b.top + b.height/2);
    try{ if(window.SFX){ SFX.whoosh(); SFX.tone(880,0.18,{type:'sine',vol:0.10}); } }catch(e){}
  });
  at(2380, function(){ splash.classList.add('mw-out'); });
  at(2820, function(){
    splash.style.display = 'none';
    el('mwBadge').classList.add('mw-show');
    try{ if(window.SFX) SFX.tone(520,0.5,{type:'sine',vol:0.07,slideTo:760}); }catch(e){}
  });
  at(3500, function(){ el('mwRoad').classList.add('mw-show'); });
  at(3700, function(){ rise(el('mwYears'), 0); });
  at(4100, function(){
    wordEl.textContent = L.words[0];
    wordEl.style.opacity = '1'; wordEl.style.transform = 'translateY(0)';
    rise(el('mwGuests'), 0);
    wordTimer = setInterval(rotateWord, 2400);
  });
  at(4500, function(){ rise(el('mwInvite'), 0); });
  at(4900, function(){
    rise(el('mwCta'), 0);
    try{ if(window.SFX) SFX.pop(); }catch(e){}
  });
  }

  /* ================= leaving ================= */
  /* Play & Win opens the one prize game this guest was dealt. If their go
     is already spent the door still opens - the game shows their result and
     the rest of the arcade underneath. */
  function launchPrizeGame(){
    try{
      var A = window.ARCADE;
      if(!A) return;
      var mine = A.prizeGame && A.prizeGame();
      if(mine) A.openGame(mine);
    }catch(e){}
  }

  var leaving = false;
  function enter(){
    if(leaving) return;
    leaving = true;
    try{ if(window.SFX) SFX.select(); }catch(e){}
    launchPrizeGame();
    timers.forEach(clearTimeout);
    if(wordTimer) clearInterval(wordTimer);
    root.classList.add('mw-gone');
    document.documentElement.style.overflow = '';
    setTimeout(function(){
      cancelAnimationFrame(raf);
      if(root.parentNode) root.parentNode.removeChild(root);
    }, 600);
  }
  el('mwCta').addEventListener('click', enter);
  document.addEventListener('keydown', function(e){
    if(!leaving && (e.key === 'Escape' || e.key === 'Enter')) enter();
  });

  document.documentElement.style.overflow = 'hidden';

  /* Last thing: ask the pass whether this guest has already seen the film
     today. Everything above must exist before the timeline can run. */
  PASS.ready(function(){
    if(PASS.introDone()){ dropIntro(); return; }
    PASS.markIntro();
    runIntro();
  });
})();
</script>
</body>
</html>
