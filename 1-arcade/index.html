<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16211e">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%2316211e%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20font-family%3D%22Helvetica%2CArial%2Csans-serif%22%20font-size%3D%2233%22%20font-weight%3D%22bold%22%20fill%3D%22%23ef4e22%22%20text-anchor%3D%22middle%22%3E17%3C%2Ftext%3E%3C%2Fsvg%3E">
<title>7 Midway Plaza &mdash; Table Arcade</title>
<style>:root{
  /* Mile 17: orange and teal off the badge, on a deep green-black road at night */
  --charcoal:#16211e; --charcoal-2:#213029; --turmeric:#ef4e22; --turmeric-2:#ff8a5c;
  --tamarind:#0f4b3f; --cream:#eef4f1; --leaf:#2ea88b; --clay:#ef4e22; --bad:#e2513a;
  --ui:'Georgia','Iowan Old Style',serif;
  --sans:'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;min-height:100%;overscroll-behavior-y:contain;
  background:radial-gradient(circle at 50% 0%,var(--charcoal-2),var(--charcoal) 65%);
  background-attachment:fixed;color:var(--cream);font-family:var(--ui);}
.wrap{max-width:540px;margin:0 auto;padding:18px 14px 60px;}
button{font-family:var(--ui);cursor:pointer;}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.topbar .sp{flex:1;}
#backBtn{background:transparent;border:1px solid rgba(239,78,34,.45);color:var(--cream);
  border-radius:999px;padding:6px 14px;font-size:12.5px;}
.langbar{display:flex;gap:5px;}
.lang-pill{background:transparent;border:1px solid rgba(239,78,34,.3);color:#b7a48e;
  padding:5px 11px;border-radius:999px;font-size:11.5px;transition:all .15s;}
.lang-pill.on{background:rgba(239,78,34,.18);border-color:var(--turmeric-2);color:var(--turmeric-2);}

.brand{text-align:center;}
/* Inside a game the board is what matters, so the mark steps aside and the
   game starts where the logo used to be. */
body.playing .brand{display:none;}
body.playing .wrap{padding-top:10px;}
.brand img{display:block;width:104px;height:auto;margin:0 auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));}
.brand .line{width:44px;height:2px;background:var(--turmeric);margin:10px auto 12px;border-radius:2px;opacity:.7;}
h1{font-size:25px;margin:0 0 4px;text-align:center;font-weight:400;}
.sub{font-size:13px;color:#c9b8a3;text-align:center;margin:0 auto 6px;font-style:italic;max-width:320px;line-height:1.5;}
.tabletag{font-size:11px;color:#5d736d;text-align:center;margin:0 0 20px;letter-spacing:.5px;}

/* hub */
#gameList{display:grid;gap:9px;}
.card{display:flex;align-items:center;gap:13px;text-align:left;width:100%;
  background:linear-gradient(160deg,#22332e,#1a2723);border:1px solid rgba(239,78,34,.28);
  border-radius:15px;padding:13px 14px;color:var(--cream);transition:border-color .15s,transform .08s;}
.card:active{transform:scale(.985);border-color:var(--turmeric-2);}
.card-icon{font-size:26px;flex:0 0 auto;width:34px;text-align:center;}
.card-body{flex:1;min-width:0;}
.card-name{font-size:15px;color:var(--turmeric-2);margin-bottom:2px;}
.card-desc{font-size:12px;color:#a3b8b1;line-height:1.45;}
.empty{text-align:center;color:#8fa39c;font-size:13px;padding:30px 10px;}

/* generic game chrome */
#gameTitle{font-size:20px;text-align:center;color:var(--turmeric-2);margin:0 0 14px;font-weight:400;}
.g-hud{display:flex;justify-content:space-between;font-size:11.5px;color:#cfe3db;margin-bottom:10px;}
.g-hint{font-size:11.5px;color:#8fa39c;text-align:center;margin:10px 0 0;}
.g-hint.bad{color:var(--bad);}
.btn-primary{display:block;width:100%;margin:14px auto 0;
  background:linear-gradient(180deg,#ff7a4a,var(--turmeric) 58%,#d63d13);border:none;
  border-radius:13px;padding:14px 0;font-size:15px;font-weight:700;letter-spacing:1.2px;color:#ffffff;
  box-shadow:0 5px 0 #b5330e,0 8px 16px rgba(0,0,0,.4);}
.btn-primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #b5330e;}
.btn-primary:disabled{opacity:.45;box-shadow:none;}
.btn-ghost{display:block;margin:16px auto 0;background:transparent;
  border:1px solid rgba(239,78,34,.5);color:var(--cream);padding:9px 20px;border-radius:10px;font-size:12.5px;}
.pill-row{display:flex;gap:7px;justify-content:center;margin:12px 0 0;}
.pill{flex:1;background:transparent;border:1px solid rgba(239,78,34,.45);color:var(--cream);
  padding:9px 4px;border-radius:9px;font-size:12px;}
.pill.on{background:rgba(239,78,34,.2);border-color:var(--turmeric-2);color:var(--turmeric-2);}
.good{color:var(--leaf);} .bad{color:var(--bad);}

.modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(6,12,11,.9);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal.show{opacity:1;pointer-events:auto;}
.modal-card{background:linear-gradient(160deg,#213029,#16211e);border:1px solid rgba(239,78,34,.45);
  border-radius:20px;padding:28px 24px;max-width:320px;text-align:center;}
.modal-emoji{font-size:42px;margin-bottom:8px;}
.modal-card h3{font-size:19px;color:var(--turmeric-2);margin:0 0 8px;font-weight:700;}
.modal-card p{font-size:13px;color:#d8e6e0;line-height:1.6;margin:0 0 14px;}
.modal-row{display:flex;gap:8px;}
.modal-row .btn-ghost{flex:1;margin:0;}

/* slot */
.g-spin{max-width:340px;margin:0 auto;background:linear-gradient(160deg,var(--tamarind),#0a352c 70%);
  border:1px solid rgba(239,78,34,.35);border-radius:22px;padding:18px 16px 20px;}
.spin-status{font-size:11.5px;color:#cfe3db;margin-bottom:12px;}
.spin-status span{color:var(--turmeric-2);font-weight:700;}
.spin-banner{background:rgba(12,21,19,.72);border:1px solid rgba(239,78,34,.45);border-radius:11px;
  padding:10px 12px;margin-bottom:12px;font-size:12.5px;line-height:1.5;color:#f0dcc2;}
.spin-reels{display:flex;gap:8px;background:#0c1513;border-radius:13px;padding:12px;position:relative;
  box-shadow:inset 0 4px 14px rgba(0,0,0,.6);}
.spin-reel{flex:1;height:var(--reelh);overflow:hidden;border-radius:9px;border:1px solid rgba(239,78,34,.15);
  background:linear-gradient(180deg,#0a110f,#1a100d 50%,#0a110f);position:relative;}
.spin-reel::before,.spin-reel::after{content:"";position:absolute;left:0;right:0;height:var(--peek);z-index:2;pointer-events:none;}
.spin-reel::before{top:0;background:linear-gradient(#0c1513f2,#0c151355);}
.spin-reel::after{bottom:0;background:linear-gradient(0deg,#0c1513f2,#0c151355);}
.spin-strip{display:flex;flex-direction:column;align-items:center;}
.spin-sym{height:var(--tile);min-height:var(--tile);display:flex;align-items:center;justify-content:center;font-size:34px;}
.spin-payline{position:absolute;top:calc(12px + var(--peek));left:12px;right:12px;height:var(--tile);
  border:5px solid rgba(239,78,34,.8);border-radius:14px;z-index:3;pointer-events:none;
  transition:border-color .25s,border-width .25s,box-shadow .25s;}
.spin-payline.win{border-width:9px;border-color:#ffd75e;
  box-shadow:0 0 0 1px rgba(255,240,190,.65),0 0 40px rgba(255,138,92,.8),inset 0 0 30px rgba(255,138,92,.3);
  animation:glow 1.5s ease-in-out infinite;}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.6}}
.spin-rewards{margin-top:16px;background:rgba(12,21,19,.5);border:1px solid rgba(239,78,34,.25);
  border-radius:14px;padding:14px;}
.spin-rewards h4{font-size:13px;color:var(--turmeric-2);margin:0 0 10px;}
.rw{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid rgba(239,78,34,.14);}
.rw:first-of-type{border-top:none;padding-top:0;}
.rw-e{font-size:22px;} .rw-t{font-size:13px;margin-bottom:5px;}
.rw-note{font-size:11px;color:#92a8a1;margin:10px 0 0;line-height:1.5;}

/* wheel */
.g-wheel{text-align:center;}
.wheel-stage{position:relative;width:min(84vw,320px);height:min(84vw,320px);margin:0 auto;}
.wheel-disc{width:100%;height:100%;border-radius:50%;overflow:hidden;
  box-shadow:0 0 0 6px #16211e,0 0 0 9px var(--turmeric),0 14px 30px rgba(0,0,0,.5);}
.wheel-disc canvas{width:100%;height:100%;display:block;}
.wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
  border-top:26px solid var(--turmeric-2);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));}
.wheel-msg{font-size:16px;color:#d8e6e0;margin:18px 0 0;min-height:24px;}
.wheel-msg.good{color:var(--turmeric-2);font-weight:700;}

/* sudoku */
.g-sudoku{text-align:center;}
/* No gaps. Every line is drawn inside the cell, so the nine columns stay
   exactly equal and the rules never shift a square by a pixel. Thin lines
   between squares, thick ones between the three-by-three boxes. */
.sud-board{position:relative;display:grid;grid-template-columns:repeat(9,1fr);gap:1px;
  background:#c5d0cb;border:3px solid #13201c;border-radius:6px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(239,78,34,.55),0 8px 22px rgba(0,0,0,.45); max-width:min(92vw,360px);margin:14px auto 0;}
.sud-board::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:2;
  background:
    linear-gradient(to right,
      transparent calc(33.333% - 1.25px), #13201c calc(33.333% - 1.25px),
      #13201c calc(33.333% + 1.25px), transparent calc(33.333% + 1.25px),
      transparent calc(66.667% - 1.25px), #13201c calc(66.667% - 1.25px),
      #13201c calc(66.667% + 1.25px), transparent calc(66.667% + 1.25px)),
    linear-gradient(to bottom,
      transparent calc(33.333% - 1.25px), #13201c calc(33.333% - 1.25px),
      #13201c calc(33.333% + 1.25px), transparent calc(33.333% + 1.25px),
      transparent calc(66.667% - 1.25px), #13201c calc(66.667% - 1.25px),
      #13201c calc(66.667% + 1.25px), transparent calc(66.667% + 1.25px));}
.sud-cell{aspect-ratio:1;background:#f6f8f7;color:#0f6b56;display:flex;align-items:center;
  justify-content:center;font-family:var(--sans);font-size:min(4.6vw,19px);font-weight:600;cursor:pointer;}
.sud-cell.given{color:#13201c;background:#e8edea;font-weight:800;}
.sud-cell.peer{background:#fdeee6;}
.sud-cell.given.peer{background:#f5e3d9;}
.sud-cell.sel{background:#ffb48f;color:#13201c;}
.sud-cell.same{background:#ffd9c4;color:#13201c;font-weight:800;}
.sud-cell{transition:background .12s ease;}
.sud-key{position:relative;}
.sud-key::after{content:attr(data-left);position:absolute;top:3px;right:6px;font-size:9.5px;opacity:.55;font-family:var(--sans);}
.sud-key.done{opacity:.3;}
.sud-key.done::after{content:'';}
.sud-cell.bad{color:var(--bad);}
.sud-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:min(92vw,360px);margin:12px auto 0;}
.sud-key{background:transparent;border:1px solid rgba(239,78,34,.45);color:var(--cream);
  border-radius:9px;padding:11px 0;font-size:16px;font-family:var(--sans);}
.sud-key.wide{grid-column:span 5;}
.sud-note{font-size:13px;margin:12px 0 0;min-height:18px;}

/* word search */
.g-ws{text-align:center;}
.ws-status{font-size:12px;color:#cfe3db;margin:0 0 10px;}
/* One sheet of letters with ruled lines, rather than a hundred loose tiles. */
.ws-board{display:grid;gap:1px;max-width:min(94vw,380px);margin:0 auto;background:#c5d0cb;
  border:2px solid #13201c;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(239,78,34,.55),0 8px 22px rgba(0,0,0,.45); touch-action:none;}
.ws-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#f6f8f7;
  color:#13201c;font-family:var(--sans);font-size:min(3.4vw,14px);font-weight:600;cursor:pointer;}
.ws-cell.pick{background:#ff9a70;color:#fff;}
.ws-cell.got{color:#0c2a20;animation:wsGot .45s ease;}
@keyframes wsGot{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
.ws-word.got{color:#0c2a20;border-color:transparent;text-decoration:line-through;}
.ws-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px;}
.ws-word{font-size:11.5px;border:1px solid rgba(239,78,34,.35);border-radius:999px;padding:4px 10px;color:#d8c3a6;}
.ws-word.got{color:#6f8680;text-decoration:line-through;border-color:rgba(239,78,34,.15);}

/* memory */
/* Cards, so they keep their gaps - but on a framed table like the others. */
.mem-board{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:min(88vw,340px);
  margin:0 auto;padding:10px;background:#0c1513;border:2px solid #13201c;
  border-radius:10px;box-shadow:0 0 0 1px rgba(239,78,34,.55),0 8px 22px rgba(0,0,0,.45);}
.mem-hud{display:flex;justify-content:space-between;}
/* Two-faced cards that turn over in 3D. The back carries the 17 mark so a
   face-down deck looks like a printed deck, not blank tiles. */
.mem-board{perspective:900px;}
.mem-card{aspect-ratio:.78;padding:0;border:0;background:transparent;cursor:pointer;
  -webkit-tap-highlight-color:transparent;animation:memDeal .38s cubic-bezier(.2,.9,.3,1.2) both;}
@keyframes memDeal{from{opacity:0;transform:translateY(14px) scale(.85);}to{opacity:1;transform:none;}}
.mem-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .42s cubic-bezier(.3,.8,.3,1.08);}
.mem-card.up .mem-inner{transform:rotateY(180deg);}
.mem-face{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;}
.mem-back{background:
   repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,transparent 6px 12px),
   linear-gradient(160deg,#1a8a70,#0d5c4a);
  border:2px solid rgba(255,255,255,.14);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);}
.mem-mark{font-family:var(--sans);font-weight:800;font-size:min(5vw,20px);color:rgba(255,255,255,.28);
  letter-spacing:-1px;}
.mem-front{transform:rotateY(180deg);background:linear-gradient(170deg,#ffffff,#e9efec);
  border:2px solid #d4ddd9;font-size:min(8vw,32px);box-shadow:0 4px 10px rgba(0,0,0,.3);}
.mem-card:active:not(.up) .mem-inner{transform:scale(.95);}
/* a pair lands with a little bounce and a green edge; a wrong pair shakes */
.mem-card.pair .mem-front{border-color:#3fbf97;background:linear-gradient(170deg,#eafff7,#c9f1e3);
  animation:memPair .5s ease;}
@keyframes memPair{0%{transform:rotateY(180deg) scale(1);}45%{transform:rotateY(180deg) scale(1.12);}100%{transform:rotateY(180deg) scale(1);}}
.mem-card.done{cursor:default;}
.mem-card.nope .mem-front{border-color:#e2513a;animation:memNope .42s ease;}
@keyframes memNope{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-5px);}
  50%{transform:rotateY(180deg) translateX(5px);}75%{transform:rotateY(180deg) translateX(-3px);}}
@media (prefers-reduced-motion:reduce){ .mem-inner{transition:none;} .mem-card{animation:none;} }

/* quiz / cost */
.quiz-q{font-size:15px;line-height:1.5;text-align:center;margin:8px 0 16px;min-height:44px;}
.quiz-opts{display:grid;gap:8px;}
.quiz-opt{width:100%;background:linear-gradient(160deg,#22332e,#1a2723);color:var(--cream);
  border:1px solid rgba(239,78,34,.3);border-radius:11px;padding:13px;font-size:13.5px;text-align:left;}
.quiz-opt.right{background:rgba(46,168,139,.45);border-color:var(--leaf);}
.quiz-opt.wrongo{background:rgba(226,81,58,.35);border-color:var(--bad);}
.quiz-fb{text-align:center;font-size:13px;margin:14px 0 0;min-height:20px;}
.quiz-done{text-align:center;padding:14px 0;}
.quiz-done h3{font-size:20px;color:var(--turmeric-2);margin:0 0 6px;}

/* scramble */
.g-scr{text-align:center;}
.scr-slot{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0 18px;}
.scr-cell{width:32px;height:38px;border-bottom:2px solid var(--turmeric);display:flex;
  align-items:center;justify-content:center;font-family:var(--sans);font-size:19px;font-weight:700;color:var(--turmeric-2);}
.scr-letters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
.scr-key{width:38px;height:44px;border-radius:9px;background:#eef4f1;color:#16211e;border:none;
  font-family:var(--sans);font-size:18px;font-weight:700;}
.scr-key.used{background:#4a382e;color:#5d736d;}

/* 2048 */
.t-board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#0c1513;padding:8px;
  border-radius:12px;max-width:min(88vw,330px);margin:0 auto;touch-action:none;}
.t-tile{aspect-ratio:1;border-radius:8px;background:rgba(238,244,241,.07);display:flex;
  align-items:center;justify-content:center;font-family:var(--sans);font-weight:700;font-size:min(6vw,24px);color:#16211e;}
.t-tile.v2{background:#efe3cf}.t-tile.v4{background:#eddcbc}.t-tile.v8{background:#f0b06a;color:#fff}
.t-tile.v16{background:#ef9257;color:#fff}.t-tile.v32{background:#ef7a5c;color:#fff}
.t-tile.v64{background:#e85d3a;color:#fff}.t-tile.v128{background:#e6c25e;color:#fff;font-size:min(5vw,20px)}
.t-tile.v256{background:#e5bb4b;color:#fff;font-size:min(5vw,20px)}
.t-tile.v512{background:#e4b83f;color:#fff;font-size:min(5vw,20px)}
.t-tile.v1024{background:#ef4e22;color:#fff;font-size:min(4.2vw,17px)}
.t-tile.v2048{background:#ff8a5c;color:#ffffff;font-size:min(4.2vw,17px)}

/* snake */
/* Faint ruled squares, so distance to a wall can be judged at a glance
   without the grid competing with the car. */
.sn-board{display:grid;gap:1px;background:#1c302a;padding:0;border-radius:6px;
  border:2px solid #0a1210;overflow:hidden;box-shadow:0 0 0 1px rgba(239,78,34,.55),0 8px 22px rgba(0,0,0,.45);
  max-width:min(90vw,340px);margin:0 auto;touch-action:none;}
.sn-cell{aspect-ratio:1;background:#0d1715;border-radius:0;display:flex;
  align-items:center;justify-content:center;font-size:min(3vw,12px);
  /* A grid row otherwise grows to fit the emoji inside it, and on a small
     phone that is taller than the square - the board stops being square and
     pushes the arrows off the screen. min-height:0 lets the square win. */
  min-height:0;min-width:0;overflow:hidden;line-height:1;}
/* The head is the car itself, so no fill behind it - the emoji is the car.
   Most fonts draw it facing left, so the other three directions are turned
   off that. */
.sn-cell.head{background:transparent;font-size:min(3.4vw,14px);line-height:1;}
.sn-cell.head[data-dir="L"]{transform:none;}
.sn-cell.head[data-dir="R"]{transform:scaleX(-1);}
.sn-cell.head[data-dir="U"]{transform:rotate(90deg);}
.sn-cell.head[data-dir="D"]{transform:rotate(-90deg);}
/* the tail is the road it has covered, centre line and all */
.sn-cell.body{background:#11211d;position:relative;}
.sn-cell.body::after{content:'';position:absolute;left:22%;right:22%;top:44%;height:12%;
  background:rgba(244,247,245,.5);border-radius:1px;}
/* Board and arrows must both fit on one phone screen with nothing to
   scroll, so the board gives up size before the arrows go below the fold. */
.sn-stage{position:relative;max-width:min(90vw,340px,calc(100vh - 360px));max-width:min(90vw,340px,calc(100svh - 360px));margin:0 auto;
  touch-action:none;-webkit-user-select:none;user-select:none;}
.sn-stage .sn-board{max-width:100%;}
.sn-speeds{margin-bottom:6px;}
.scr-cell.on{cursor:pointer;animation:scrIn .22s cubic-bezier(.2,1.4,.4,1);}
@keyframes scrIn{from{transform:scale(.4);opacity:0;}to{transform:scale(1);opacity:1;}}
.scr-key.used{transform:scale(.88);}
.scr-back{display:block;margin:10px auto 0;min-width:88px;height:44px;border-radius:12px;font-size:20px;
  color:#f4f7f5;background:rgba(255,255,255,.05);border:1px solid rgba(239,78,34,.45);
  touch-action:manipulation;}
.scr-back:disabled{opacity:.35;}
.scr-back:active:not(:disabled){transform:translateY(1px);background:rgba(239,78,34,.25);}
.sn-speeds .pill{padding:7px 0;font-size:13px;}
/* The veil covers the board before a run, when paused and after a crash.
   Tapping anywhere on it does the obvious thing. */
.sn-veil{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;text-align:center;padding:16px;border-radius:6px;
  background:rgba(8,14,13,.72);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);opacity:0;pointer-events:none;
  transition:opacity .18s ease;}
.sn-veil.on{opacity:1;pointer-events:auto;cursor:pointer;}
.sn-veil-big{font-family:var(--ui);font-size:24px;font-weight:700;color:#f4f7f5;}
.sn-veil-small{font-family:var(--sans);font-size:12.5px;color:#b9cbc4;max-width:230px;line-height:1.45;}
/* Inverted T, like a keyboard's arrows: two rows instead of three, and each
   key a full thumb wide. */
.sn-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  max-width:min(88vw,290px);margin:12px auto 0;}
.sn-key{height:58px;border-radius:14px;font-size:24px;line-height:1;color:#f4f7f5;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(239,78,34,.5);box-shadow:0 3px 0 rgba(0,0,0,.35);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;transition:transform .06s ease,background .06s ease;}
.sn-key.up{grid-column:2;grid-row:1;}
.sn-key.left{grid-column:1;grid-row:2;}
.sn-key.down{grid-column:2;grid-row:2;}
.sn-key.right{grid-column:3;grid-row:2;}
.sn-key.hit,.sn-key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35);
  background:rgba(239,78,34,.32);}
/* Short phones (an iPhone SE is 568px tall) give the board more room by
   trimming the arrows a little rather than the other way round. */
@media (max-height:640px){
  .sn-key{height:50px;font-size:21px;}
  .sn-pad{gap:6px;margin-top:8px;}
  .sn-stage{max-width:min(90vw,340px,calc(100vh - 318px));max-width:min(90vw,340px,calc(100svh - 318px));}
  .sn-veil-big{font-size:20px;}
}
/* The preview's control strip takes ~50px off the bottom of the screen. */
body.pv-on .sn-stage{max-width:min(90vw,340px,calc(100vh - 412px));max-width:min(90vw,340px,calc(100svh - 412px));}
@media (max-height:640px){ body.pv-on .sn-stage{max-width:min(90vw,340px,calc(100vh - 362px));max-width:min(90vw,340px,calc(100svh - 362px));} }
/* Highway Run is a 3D road now: a portrait window onto it, sized so the
   window and the two lane keys both fit on one phone screen. */
.hr-stage{position:relative;width:min(calc(100vw - 12px),560px);left:50%;transform:translateX(-50%);
  height:clamp(320px,calc(100vh - 228px),760px);height:clamp(320px,calc(100svh - 228px),760px);
  margin:0 auto;border-radius:8px;overflow:hidden;background:#d9d3c2;touch-action:none;
  -webkit-user-select:none;user-select:none;
  box-shadow:0 0 0 1px rgba(239,78,34,.55),0 8px 22px rgba(0,0,0,.45);}
.hr-stage canvas{display:block;width:100%;height:100%;}
.hr-pad{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:min(88vw,300px);margin:12px auto 0;}
body.pv-on .hr-stage{height:clamp(300px,calc(100vh - 276px),720px);height:clamp(300px,calc(100svh - 276px),720px);}
/* the score and speed, on the road */
.hr-stage .g-hud{position:absolute;top:10px;left:10px;right:10px;z-index:5;margin:0 !important;pointer-events:none;}
.hr-stage .g-hud > *{background:rgba(8,12,11,.6);-webkit-backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  border-color:rgba(255,255,255,.2) !important;color:#fff;font-weight:600;}
.hr-stage .sn-veil{z-index:4;}
/* the lane keys, floating over the bottom of the road, above everything */
.hr-stage .hr-pad{position:absolute;left:12px;right:12px;bottom:12px;z-index:6;margin:0 !important;max-width:none;
  display:flex;justify-content:space-between;}
.hr-stage .hr-key{width:88px;height:64px;font-size:26px;color:#fff;
  background:rgba(8,12,11,.42) !important;border:1px solid rgba(255,255,255,.35) !important;
  -webkit-backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}

/* tic tac toe */
.g-ttt{text-align:center;}
.ttt-msg{font-size:14px;margin:0 0 14px;min-height:20px;color:#cfe3db;}
.ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:min(74vw,270px);margin:0 auto;}
.ttt-cell{aspect-ratio:1;background:linear-gradient(160deg,#22332e,#1a2723);border:1px solid rgba(239,78,34,.3);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:min(11vw,42px);cursor:pointer;color:var(--turmeric-2);font-family:var(--sans);font-weight:700;}

/* reaction */
.rx-board{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:min(84vw,320px);margin:0 auto;}
.rx-hole{aspect-ratio:1;border-radius:50%;background:#0c1513;border:2px solid rgba(239,78,34,.25);
  display:flex;align-items:center;justify-content:center;font-size:min(9vw,36px);cursor:pointer;transition:background .1s;}
.rx-hole.on{background:#22332e;border-color:var(--turmeric-2);}

/* crossword */
.g-cw{--cwcell:24px;}
.cw-note{font-size:11.5px;color:#8fa39c;text-align:center;margin:0 0 12px;line-height:1.5;}
.cw-board{background:#13201c;border-radius:6px;padding:0;
  width:max-content;max-width:100%;margin:0 auto;box-shadow:0 0 0 1px rgba(239,78,34,.55),0 8px 22px rgba(0,0,0,.45); overflow:hidden;}
.cw-grid{display:grid;gap:1px;background:#13201c;border:2px solid #13201c;}
.cw-cell{width:var(--cwcell);height:var(--cwcell);position:relative;background:#13201c;}
.cw-cell.open{background:#f6f8f7;color:#13201c;border-radius:0;display:flex;align-items:center;
  justify-content:center;font-family:var(--sans);font-size:calc(var(--cwcell)*.55);font-weight:600;
  cursor:pointer;touch-action:manipulation;}
.cw-cell.in{background:#fde3cf;}
.cw-cell.cur{background:#ffb48f;box-shadow:inset 0 0 0 2px #d63d13;}
.cw-cell.bad{color:var(--bad);} .cw-cell.lock{color:#6b8079;}
.cw-num{position:absolute;top:1px;left:2px;font-size:calc(var(--cwcell)*.3);font-weight:700;
  font-family:var(--sans);color:#6d7f78;line-height:1;}
.cw-ghost{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;
  font-size:16px;caret-color:transparent;background:transparent;}
.cw-clue{background:linear-gradient(160deg,var(--tamarind),#0a352c 70%);border:1px solid rgba(239,78,34,.35);
  border-radius:11px;padding:11px 14px;font-family:var(--sans);font-size:14px;line-height:1.5;
  color:#eef4f1;min-height:calc(2 * 1.5em + 22px);margin:0 auto 12px;max-width:min(94vw,420px);
  display:flex;align-items:center;gap:10px;text-align:left;}
/* Before any box is tapped the bar is the instruction, so it looks like one. */
.cw-clue.waiting{border-color:rgba(255,138,92,.85);background:linear-gradient(160deg,#0f4b3f,#0a352c 70%);
  box-shadow:0 0 0 3px rgba(239,78,34,.14);font-weight:600;}
.cw-point{font-size:20px;flex:0 0 auto;line-height:1;animation:cwNudge 1.6s ease-in-out infinite;}
@keyframes cwNudge{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
@media (prefers-reduced-motion:reduce){ .cw-point{animation:none;} }
/* On the narrowest phones, one notch smaller so a clue still fits in two
   lines and the grid does not shift down when the first box is tapped. */
@media (max-width:360px){ .cw-clue{font-size:13px;padding:10px 12px;} }
.cw-clue .k{color:var(--turmeric-2);font-weight:700;white-space:nowrap;}
.cw-clue-text{flex:1 1 auto;min-width:0;}
.cw-cluebar{display:flex;align-items:stretch;gap:6px;max-width:min(94vw,420px);margin:0 auto 12px;}
.cw-cluebar .cw-clue{flex:1 1 auto;margin:0;min-width:0;}
.cw-step{flex:0 0 40px;border-radius:11px;font-size:26px;line-height:1;color:#f4f7f5;
  background:rgba(255,255,255,.05);border:1px solid rgba(239,78,34,.45);touch-action:manipulation;}
.cw-step:active{background:rgba(239,78,34,.3);}
/* The keyboard stays pinned to the bottom of the screen while the grid
   scrolls above it, so the next letter is always one tap away. */
.cw-kb{position:sticky;bottom:0;z-index:5;margin:12px auto 0;max-width:min(98vw,440px);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  background:rgba(12,21,19,.96);border-top:1px solid rgba(239,78,34,.35);border-radius:14px 14px 0 0;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
.cw-kb-row{display:flex;justify-content:center;gap:5px;margin-bottom:6px;}
.cw-kb-row:last-child{margin-bottom:0;}
.cw-key{flex:1 1 0;max-width:40px;height:46px;border-radius:8px;font-family:var(--sans);font-size:17px;
  font-weight:700;color:#13201c;background:#f1f5f3;border:0;box-shadow:0 2px 0 #9fb0aa;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;padding:0;}
.cw-key.del{max-width:62px;flex:1.5 1 0;font-size:20px;background:#ffd2bd;}
.cw-key.hit,.cw-key:active{transform:translateY(2px);box-shadow:0 0 0 #9fb0aa;background:#ffb48f;}
/* a desktop has a real keyboard, so the on-screen one only appears on touch */
@media (hover:hover) and (pointer:fine){ .cw-kb{display:none;} }
.cw-lists{display:flex;gap:18px;margin-top:20px;flex-wrap:wrap;}
.cw-lists section{flex:1;min-width:190px;}
.cw-lists h4{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--turmeric-2);margin:0 0 8px;}
.cw-li{font-size:12.5px;line-height:1.5;padding:6px 7px;border-radius:6px;cursor:pointer;color:#e0d0bd;}
.cw-li b{color:var(--turmeric-2);margin-right:5px;}
.cw-li .nat{color:var(--turmeric-2);font-style:normal;}
.cw-li.done{color:#6f8680;} .cw-li.done .ct{text-decoration:line-through;}
.cw-li.sel{background:rgba(239,78,34,.14);color:var(--cream);}

/* staff panel */
#adminBtn{display:block;margin:26px auto 0;background:transparent;border:1px dashed rgba(239,78,34,.4);
  color:#92a8a1;padding:8px 18px;border-radius:9px;font-size:12px;}
.admin-card{background:linear-gradient(160deg,#213029,#16211e);border:1px solid rgba(239,78,34,.45);
  border-radius:18px;padding:22px 20px;max-width:380px;width:100%;max-height:82vh;overflow:auto;}
.admin-card h3{font-size:17px;color:var(--turmeric-2);margin:0 0 4px;}
.admin-card .hint{font-size:12px;color:#92a8a1;margin:0 0 14px;line-height:1.5;}
.arow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(239,78,34,.12);font-size:13px;}
.arow:first-of-type{border-top:none;}
.arow input{width:17px;height:17px;accent-color:var(--turmeric);}
.aicon{font-size:17px;width:24px;text-align:center;}
#adminLink{width:100%;margin-top:14px;background:#0c1513;border:1px solid rgba(239,78,34,.35);
  color:var(--turmeric-2);border-radius:8px;padding:9px;font-family:'Courier New',monospace;font-size:16px;}
.admin-note{font-size:11px;color:#8fa39c;margin:8px 0 14px;line-height:1.5;}
.admin-row{display:flex;gap:8px;}
.admin-row button{flex:1;background:transparent;border:1px solid rgba(239,78,34,.5);color:var(--cream);
  padding:9px;border-radius:9px;font-size:12.5px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

/* spin: what to do once the three chances are gone */
.spin-more{margin-top:18px;padding-top:16px;border-top:1px solid rgba(239,78,34,.2);}
.spin-more h4{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--turmeric-2);margin:0 0 10px;}
.more-card{display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin-bottom:7px;
  background:rgba(12,21,19,.45);border:1px solid rgba(239,78,34,.25);border-radius:12px;
  padding:10px 12px;color:var(--cream);transition:border-color .15s,transform .08s;}
.more-card:active{transform:scale(.985);border-color:var(--turmeric-2);}
.more-icon{font-size:21px;width:26px;text-align:center;flex:0 0 auto;}
.more-body{display:flex;flex-direction:column;min-width:0;}
.more-name{font-size:13.5px;color:var(--turmeric-2);}
.more-desc{font-size:11px;color:#a3b8b1;line-height:1.4;}

/* Phone-first: no text selection or double-tap zoom on any play surface */
.sud-board,.ws-board,.mem-board,.t-board,.sn-board,.ttt-board,.rx-board,
.cw-grid,.spin-reels,.wheel-stage,.scr-letters,.scr-slot,.quiz-opts{
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.sud-cell,.ws-cell,.mem-card,.ttt-cell,.rx-hole,.sud-key,.sn-key,.scr-key{
  touch-action:manipulation;
}

/* ===================== engagement juice ===================== */
@keyframes fxShake { 0%,100%{transform:translateX(0);} 15%{transform:translateX(-9px);} 30%{transform:translateX(8px);} 45%{transform:translateX(-6px);} 60%{transform:translateX(5px);} 75%{transform:translateX(-3px);} 90%{transform:translateX(2px);} }
body.fx-shake{ animation: fxShake 0.42s ease; }
.fx-confetti{ position:fixed; top:0;right:0;bottom:0;left:0;inset:0; pointer-events:none; z-index:9999; }
@keyframes fxIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
#hub.fx-in, #gameScreen.fx-in{ animation: fxIn .32s cubic-bezier(.2,.8,.3,1); }
@keyframes cardIn { from{opacity:0; transform:translateY(8px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
.rules{max-width:min(90vw,340px);margin:0 auto 14px;}
.rules-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(255,255,255,.04);border:1px solid rgba(239,78,34,.35);border-radius:10px;
  padding:9px 14px;color:var(--turmeric-2);font-family:var(--sans);font-size:13px;
  letter-spacing:.3px;}
.rules-btn:active{transform:scale(.99);background:rgba(255,255,255,.07);}
.rules-chev{font-size:11px;transition:transform .22s ease;opacity:.8;}
.rules.open .rules-chev{transform:rotate(180deg);}
/* Closed by default and animated on height, so opening it does not make the
   board jump under the player's thumb. */
.rules-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.rules.open .rules-body{max-height:460px;}
.rules-list{margin:10px 0 0;padding:0 0 0 20px;text-align:left;}
.rules-list li{font-family:var(--sans);font-size:12.5px;line-height:1.55;color:#c3d4cf;
  margin-bottom:7px;}
.rules-list li::marker{color:var(--turmeric);font-weight:700;}


/* ---------- the slot machine, made to look like one ----------
   A lit marquee around the window, reels shaded like drums that curve away
   at the top and bottom, a sheen of glass over the front, and a lever on
   the side that can be pulled down like the real thing. */
.slot-cab{position:relative;display:flex;align-items:stretch;gap:8px;}
.slot-cab .spin-reels{flex:1;padding:14px;border-radius:16px;
  background:linear-gradient(180deg,#2a1a10,#150c07);
  box-shadow:inset 0 0 0 2px #7a4a18, inset 0 0 0 5px #3b2210, 0 10px 26px rgba(0,0,0,.5);}
/* chasing bulbs round the window */
.slot-cab .spin-reels::before{content:'';position:absolute;top:4px;right:4px;bottom:4px;left:4px;inset:4px;border-radius:13px;pointer-events:none;
  background:
   radial-gradient(circle,#ffe29a 0 2.2px,transparent 2.8px) 0 0/16px 16px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:4px;
  opacity:.85;animation:bulbs .9s steps(2) infinite;}
.slot-cab.lit .spin-reels::before{animation-duration:.18s;opacity:1;}
@keyframes bulbs{0%{background-position:0 0;}100%{background-position:8px 0;}}
/* each reel is a drum: bright in the middle, falling into shadow as it curves */
.slot-cab .spin-reel{background:linear-gradient(180deg,#d9d2c3 0%,#fbf8f1 22%,#ffffff 50%,#fbf8f1 78%,#d9d2c3 100%);
  border:2px solid #2a1a10;border-radius:8px;}
.slot-cab .spin-reel::before{height:42%;background:linear-gradient(180deg,rgba(20,10,4,.72),rgba(20,10,4,0));}
.slot-cab .spin-reel::after{height:42%;background:linear-gradient(0deg,rgba(20,10,4,.72),rgba(20,10,4,0));}
.slot-cab .spin-sym{font-size:36px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18));}
/* glass */
.slot-glass{position:absolute;left:14px;right:14px;top:14px;bottom:14px;border-radius:9px;pointer-events:none;z-index:3;
  background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.08) 100%);}
.slot-cab .spin-payline{z-index:4;border-radius:10px;}
.slot-cab .spin-payline.win{animation:paylineFlash .35s steps(2) 6;}
@keyframes paylineFlash{0%{border-color:#ffd75e;box-shadow:0 0 22px rgba(255,215,94,.9);}100%{border-color:#ff7a45;box-shadow:0 0 8px rgba(255,122,69,.5);}}
/* the lever */
.slot-lever{position:relative;width:34px;flex:0 0 34px;touch-action:none;cursor:grab;
  -webkit-tap-highlight-color:transparent;}
.slot-lever .lv-base{position:absolute;left:4px;right:4px;bottom:26%;height:34px;border-radius:8px;
  background:linear-gradient(90deg,#3b2210,#7a4a18 50%,#3b2210);box-shadow:0 3px 8px rgba(0,0,0,.45);}
.slot-lever .lv-arm{position:absolute;left:50%;width:8px;margin-left:-4px;bottom:calc(26% + 17px);height:55%;
  border-radius:4px;background:linear-gradient(90deg,#9aa4a8,#f1f4f5 45%,#7d878b);
  transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1);}
.slot-lever .lv-knob{position:absolute;left:50%;top:-14px;width:26px;height:26px;margin-left:-13px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff9c78,#ef4e22 55%,#a82d0b);
  box-shadow:0 3px 7px rgba(0,0,0,.5),inset 0 -2px 3px rgba(0,0,0,.25);}
.slot-lever.pulled .lv-arm{transform:scaleY(-.62);transition:transform .16s ease-in;}
.slot-lever.off{opacity:.45;cursor:default;}
.p3d-wait{position:relative;}
.p3d-wait > :not(.p3d-loading){visibility:hidden;}
.p3d-loading{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;font-family:var(--sans);font-size:13px;font-weight:600;color:#d6e4de;
  pointer-events:none;z-index:5;}
.p3d-loading span{width:34px;height:34px;border-radius:50%;border:3px solid rgba(239,78,34,.25);
  border-top-color:#ef4e22;animation:p3dSpin .8s linear infinite;}
@keyframes p3dSpin{to{transform:rotate(360deg);}}
/* the demonstration finger, its press ring, and the caption */
.demo-hand{position:absolute;left:0;top:0;z-index:9;font-size:38px;line-height:1;pointer-events:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.55));opacity:0;}
.demo-ring{position:absolute;left:0;top:0;z-index:8;width:34px;height:34px;margin:-17px 0 0 -17px;
  border-radius:50%;border:3px solid rgba(255,255,255,.9);box-shadow:0 0 12px rgba(255,255,255,.5);
  pointer-events:none;opacity:0;}
.demo-label{position:absolute;z-index:9;pointer-events:none;white-space:nowrap;opacity:0;
  font-family:var(--sans);font-size:12.5px;font-weight:700;color:#0c2a20;background:#7fdcbf;
  padding:5px 11px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.35);}
/* a finger-sized grip round the thin lever, so it is easy to catch */
.slot-lever::before{content:'';position:absolute;top:-18px;bottom:-6px;left:-14px;right:-10px;}
/* the lever knob glows gently until the first pull, so guests find it */
.slot-lever:not(.off) .lv-knob{animation:knobCall 1.6s ease-in-out infinite;}
@keyframes knobCall{0%,100%{box-shadow:0 3px 7px rgba(0,0,0,.5),inset 0 -2px 3px rgba(0,0,0,.25),0 0 0 0 rgba(255,140,90,.55);}
  50%{box-shadow:0 3px 7px rgba(0,0,0,.5),inset 0 -2px 3px rgba(0,0,0,.25),0 0 0 9px rgba(255,140,90,0);}}
.slot-hint,.wheel-msg{font-size:13px;color:#d6e4de;}
.slot-hint.nudge,.wheel-msg.nudge{animation:hintNudge .5s ease;color:#ffb48f;}
@keyframes hintNudge{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-3px);}}
/* a win: the whole cabinet glows and pulses with the lights */
.slot-cab.jackpot .spin-reels{animation:cabWin .42s ease-in-out 8 alternate;}
@keyframes cabWin{to{box-shadow:inset 0 0 0 2px #ffd75e, inset 0 0 0 5px #7a4a18,
  0 0 34px rgba(255,210,90,.85), 0 10px 26px rgba(0,0,0,.5);}}
.slot-cab.jackpot .spin-reels::before{animation-duration:.12s;opacity:1;}
/* the wheel glows round its rim when it lands on a gift */
.wheel-stage.won::after{content:'';position:absolute;top:-6px;right:-6px;bottom:-6px;left:-6px;inset:-6px;border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 3px rgba(255,210,90,.9), 0 0 40px rgba(255,190,80,.75);
  animation:wheelWin .45s ease-in-out 8 alternate;}
@keyframes wheelWin{from{opacity:.35;}to{opacity:1;}}
.slot-hint{text-align:center;font-family:var(--sans);font-size:11.5px;color:#9fb6ae;margin:8px 0 2px;}

/* ---------- prize tail: reward card + the rest of the arcade ---------- */
.prize-tail{ margin-top:22px; opacity:0; transform:translateY(10px);
  transition:opacity .5s ease, transform .5s ease; }
.prize-tail.in{ opacity:1; transform:translateY(0); }

.reward-card{
  position:relative; overflow:hidden; text-align:center;
  border:1px solid rgba(255,138,92,.45); border-radius:18px;
  background:linear-gradient(180deg,rgba(239,78,34,.14),rgba(0,0,0,.24));
  padding:22px 18px 20px; margin-bottom:26px;
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
.reward-glow{
  position:absolute; left:50%; top:-40%; width:260px; height:260px; margin-left:-130px;
  background:radial-gradient(circle,rgba(255,170,80,.30),rgba(255,170,80,0) 70%);
  pointer-events:none; animation:rewardGlow 3.2s ease-in-out infinite;
}
@keyframes rewardGlow{ 0%,100%{ transform:scale(.85); opacity:.55; } 50%{ transform:scale(1.08); opacity:1; } }
.reward-gift{ position:relative; font-size:52px; line-height:1; animation:giftBob 2.6s ease-in-out infinite; }
@keyframes giftBob{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-7px) rotate(3deg); } }
.reward-title{ position:relative; margin:10px 0 12px; font-family:var(--ui); font-size:19px; color:var(--turmeric-2); }
.reward-share{ position:relative; margin:12px 0 0; font-family:var(--sans); font-size:13px; line-height:1.55; color:#e6d6c2; }

/* Its own lit panel, so the eye goes here the moment the prize round
   closes. Teal, not orange: orange is the colour of the reward, and this
   section is deliberately not that. */
.more-block{
  position:relative; margin-top:6px; padding:20px 16px 12px;
  background:linear-gradient(165deg,rgba(20,123,102,.30),rgba(12,21,19,.55) 70%);
  border:1px solid rgba(46,168,139,.55); border-radius:18px;
  box-shadow:0 10px 28px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,255,255,.07);
}
.more-head{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  flex-wrap:wrap; margin:0 0 8px; }
.more-title{
  margin:0; font-family:var(--ui); font-size:23px; color:#f4f7f5; font-weight:700;
  display:flex; align-items:center; gap:10px;
}
.more-title::before{ content:'\1F3AE'; font-size:22px; }
.more-badge{
  font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:#0c2a20; background:#7fd8bd;
  border-radius:999px; padding:5px 11px; white-space:nowrap;
}
/* The line itself is highlighted, so it reads as the message of the panel
   rather than small print under the heading. */
/* A solid bright fill with dark text, like a highlighter pen, so it is the
   first thing read in the panel. Mint rather than orange: orange means
   reward everywhere else, and this line is about the games that are not. */
.more-note{ margin:2px 0 16px; padding:13px 16px; border-radius:14px; text-align:center;
  font-family:var(--sans); font-size:15.5px; font-weight:800; line-height:1.5;
  color:#062019; letter-spacing:.1px;
  background:linear-gradient(135deg,#a8f0d8 0%,#7fdcbf 55%,#5fcaa9 100%);
  border:0;
  box-shadow:0 0 0 3px rgba(127,220,191,.22), 0 6px 22px rgba(95,202,169,.38);
  animation:noteIn .6s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes noteIn{ from{ opacity:0; transform:scale(.94); } to{ opacity:1; transform:scale(1); } }
@media (prefers-reduced-motion:reduce){ .more-note{ animation:none; } }
.more-card{
  width:100%; display:flex; align-items:center; gap:12px; text-align:left;
  background:rgba(255,255,255,.045); border:1px solid rgba(238,244,241,.12);
  border-radius:14px; padding:13px 14px; margin-bottom:10px; color:inherit;
  animation:cardIn .4s ease both;
}
.more-card:active{ transform:scale(.985); background:rgba(255,255,255,.08); }
.more-icon{ font-size:24px; line-height:1; flex:0 0 auto; }
.more-body{ display:flex; flex-direction:column; gap:2px; flex:1 1 auto; min-width:0; }
.more-name{ font-family:var(--ui); font-size:15.5px; color:var(--turmeric-2); }
.more-desc{ font-family:var(--sans); font-size:12.5px; color:#92a8a1; }
.more-go{ font-size:17px; color:rgba(238,244,241,.45); flex:0 0 auto; }

/* ---------- verdict lines ---------- */
.spin-pips{ display:flex; align-items:center; justify-content:center; gap:8px; margin:6px 0 16px; }
.pip-label{ font-family:var(--sans); font-size:12px; letter-spacing:.6px; color:#92a8a1; margin-right:4px; }
.pip{ width:11px; height:11px; border-radius:50%; background:rgba(238,244,241,.16);
  box-shadow:inset 0 0 0 1px rgba(238,244,241,.22); transition:background .3s ease, box-shadow .3s ease; }
.pip.on{ background:linear-gradient(180deg,#ffd07a,#ef4e22);
  box-shadow:0 0 10px rgba(239,78,34,.6), inset 0 0 0 1px rgba(255,255,255,.35); }

.spin-verdict, .wheel-verdict{
  margin:16px 0 4px; text-align:center;
  font-family:var(--ui); font-style:italic; font-weight:700; font-size:24px;
  color:#d9c3a6;
}
.spin-verdict.good, .wheel-verdict.good{
  color:var(--turmeric-2); text-shadow:0 0 24px rgba(239,78,34,.5);
  animation:verdictPop .55s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes verdictPop{ from{ opacity:0; transform:scale(.82); } to{ opacity:1; transform:scale(1); } }
.modal-emoji.pop{ animation:verdictPop .6s cubic-bezier(.2,1.4,.4,1) both; }

/* ---------- wheel furniture ---------- */
.wheel-pointer{
  transform-origin:50% 0%;
  position:absolute; left:50%; top:-6px; margin-left:-15px; z-index:3;
  width:30px; height:40px;
  background:linear-gradient(180deg,#ffd98a,#e9a63c 60%,#c47d18);
  clip-path:polygon(50% 100%, 0 0, 100% 0);
  filter:drop-shadow(0 4px 7px rgba(0,0,0,.6));
}
.wheel-stage{ position:relative; touch-action:none; cursor:grab; }
.wheel-stage:active{ cursor:grabbing; }
/* a lamp above the wheel: bright near the top, darker toward the far rim */
.wheel-disc{ position:relative; }
.wheel-disc::after{ content:''; position:absolute; top:0;right:0;bottom:0;left:0;inset:0; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 38% 28%, rgba(255,255,255,.22), rgba(255,255,255,0) 42%),
             radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 62%, rgba(0,0,0,.28) 100%); }
.wheel-msg{ text-align:center; font-family:var(--sans); font-size:13px; color:#92a8a1; margin:6px 0 16px; }

/* a guest who has already used their go sees it on the hub too */
.pass-note{
  display:flex; align-items:center; gap:12px; text-align:left;
  border:1px solid rgba(255,138,92,.4); border-radius:16px;
  background:linear-gradient(180deg,rgba(239,78,34,.13),rgba(0,0,0,.2));
  padding:14px 16px; margin-bottom:16px;
}
.pass-note .pn-gift{ font-size:30px; line-height:1; flex:0 0 auto; }
.pass-note .pn-body{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.pass-note .pn-t{ font-family:var(--ui); font-size:15.5px; color:var(--turmeric-2); }
.pass-note .pn-s{ font-family:var(--sans); font-size:12.5px; line-height:1.45; color:#c9b69f; }
.pv-bar{
  position:fixed; left:0; right:0; bottom:0; z-index:10050;
  display:flex; flex-wrap:nowrap; align-items:center; justify-content:flex-start; gap:5px;
  overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px));
  background:rgba(8,14,13,.94); border-top:1px solid rgba(239,78,34,.45);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px); font-family:var(--sans); font-size:11.5px;
}
.pv-bar::-webkit-scrollbar{ display:none; }
.pv-bar > *{ flex:0 0 auto; white-space:nowrap; }
.pv-bar b{ color:var(--turmeric-2); font-weight:700; letter-spacing:.5px; font-size:10px; }
.pv-bar span{ color:#8fa39c; font-size:10px; }
.pv-bar button{
  background:rgba(255,255,255,.07); border:1px solid rgba(239,78,34,.4);
  color:var(--cream); border-radius:999px; padding:5px 9px; font-size:11px; font-family:inherit; line-height:1.2;
}
.pv-bar button.on{ background:var(--turmeric); border-color:var(--turmeric); color:#fff; font-weight:700; }
.pv-bar .pv-sep{ width:1px; height:18px; background:rgba(239,78,34,.3); margin:0 2px; }
body.pv-on .wrap{ padding-bottom:86px; }
body.pv-on #mwPanel{ padding-bottom:70px; }

.pass-go{
  width:100%; cursor:pointer; color:inherit; gap:14px;
  border-color:rgba(255,138,92,.6);
  background:linear-gradient(180deg,rgba(239,78,34,.24),rgba(239,78,34,.10));
  box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);
  animation:goPulse 2.8s ease-in-out infinite;
}
@keyframes goPulse{
  0%,100%{ box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 0 rgba(239,78,34,.34); }
  50%    { box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 9px rgba(239,78,34,0); }
}
.pass-go:active{ transform:scale(.99); }
.pass-go .pn-gift{ animation:giftBob 2.6s ease-in-out infinite; }
.pass-go .pn-body{ flex:1 1 auto; }
.pn-go{
  flex:0 0 auto; font-family:var(--ui); font-size:13.5px; font-weight:700; color:#ffffff;
  background:linear-gradient(180deg,#f4da72,#ef4e22); border-radius:999px; padding:8px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);
}
@media (max-width:360px){ .pn-go{ display:none; } }

.card{ animation: cardIn .32s cubic-bezier(.2,.8,.3,1) backwards; }
.card, .btn-primary, .btn-ghost, .pill, .lang-pill,
.sud-key, .scr-key, .ttt-cell, .mem-card,
.c4-cell, .ms-cell, .lo-cell, .sl-tile, .hn-peg,
.mz-cell, .sc-cell, .oo-cell, .mt-item, .po-card,
.quiz-opt, .cw-cell, .rx-hole, .more-card,
.si-pad, .sn-key { transition: transform .09s ease; }
.card:active, .btn-primary:active, .btn-ghost:active, .pill:active, .lang-pill:active,
.sud-key:active, .scr-key:active, .ttt-cell:active, .mem-card:active,
.c4-cell:active, .ms-cell:active, .lo-cell:active, .sl-tile:active, .hn-peg:active,
.mz-cell:active, .sc-cell:active, .oo-cell:active, .mt-item:active, .po-card:active,
.quiz-opt:active, .cw-cell:active, .rx-hole:active, .more-card:active,
.si-pad:active, .sn-key:active { transform: scale(0.92); }
/* ================= 3D TABLE ================================================
   Every game drawn as a real object on a table: boards are thick slabs seen
   in perspective, tiles stand proud of them with a lit top edge and a shadow
   side, keys press down into the table. Built with the browser's own 3D, so
   nothing is downloaded and no game's rules or timing are touched.
   The Wheel is given depth but kept face-on, because its spin gesture is
   measured from the finger's position on the screen.                       */
:root{
  --slab-1:#0c3a30; --slab-2:#0a3129; --slab-3:#082821; --slab-4:#061f1a;
  --tile-top:#ffffff; --tile-face:#f3f5f1; --tile-side:#b9c4be;
}
@keyframes t3Lift{ from{ transform:translateY(0); } to{ transform:translateY(-3px); } }
@keyframes t3Glow{ 0%,100%{ filter:drop-shadow(0 0 3px rgba(255,210,110,.55)); }
                   50%{ filter:drop-shadow(0 0 9px rgba(255,210,110,.95)); } }
@keyframes t3Chase{ to{ transform:rotate(360deg); } }

/* ---- the slab every board sits on ---- */
.sud-board,.ws-board,.cw-board{
  transform:perspective(1100px) rotateX(13deg); transform-origin:50% 100%;
  border-radius:10px;
  box-shadow:0 2px 0 var(--slab-1),0 4px 0 var(--slab-2),0 6px 0 var(--slab-3),0 8px 0 var(--slab-4),
             0 10px 0 #051a15,0 28px 36px rgba(0,0,0,.6);
}

/* ---- Sudoku: ivory tiles on a dark slab ---- */
.sud-board{ gap:2px; padding:3px; background:#0b2e26; overflow:visible; }
/* the 3x3 box lines, redrawn in the arcade's orange so they read against the slab */
.sud-board::after{ top:3px;right:3px;bottom:3px;left:3px;inset:3px;
  background:
    linear-gradient(to right,
      transparent calc(33.333% - 1.4px), #ef5a26 calc(33.333% - 1.4px),
      #ef5a26 calc(33.333% + 1.4px), transparent calc(33.333% + 1.4px),
      transparent calc(66.667% - 1.4px), #ef5a26 calc(66.667% - 1.4px),
      #ef5a26 calc(66.667% + 1.4px), transparent calc(66.667% + 1.4px)),
    linear-gradient(to bottom,
      transparent calc(33.333% - 1.4px), #ef5a26 calc(33.333% - 1.4px),
      #ef5a26 calc(33.333% + 1.4px), transparent calc(33.333% + 1.4px),
      transparent calc(66.667% - 1.4px), #ef5a26 calc(66.667% - 1.4px),
      #ef5a26 calc(66.667% + 1.4px), transparent calc(66.667% + 1.4px)) !important; }
.sud-cell{
  background:linear-gradient(160deg,#ffffff 0%,#f1f4f0 55%,#e2e8e3 100%);
  border-radius:4px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 0 rgba(0,0,0,.14),
             inset 2px 0 0 rgba(255,255,255,.55),inset -2px 0 0 rgba(0,0,0,.07);
  text-shadow:0 1px 0 rgba(255,255,255,.9);
  transition:background .12s ease,transform .14s ease,box-shadow .14s ease;
}
.sud-cell.given{ background:linear-gradient(160deg,#e9efeb,#d6ded9); color:#0f1a17;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.18),inset 0 -1px 0 rgba(255,255,255,.7); }
.sud-cell.peer{ background:linear-gradient(160deg,#fff4ee,#f9ddcf); }
.sud-cell.same{ background:linear-gradient(160deg,#ffe6d7,#ffc6a8); }
.sud-cell.sel{ background:linear-gradient(160deg,#ffc8ab,#ff9a6a); color:#13201c; position:relative; z-index:3;
  transform:translateY(-3px) scale(1.08);
  box-shadow:0 4px 0 #b8451b,0 8px 12px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.7); }

/* ---- Word Search ---- */
.ws-board{ gap:2px; padding:3px; background:#0b2e26; }
.ws-cell{
  background:linear-gradient(160deg,#ffffff,#eef2ee 60%,#dfe6e1);
  border-radius:4px; color:#16211e;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -3px 0 rgba(0,0,0,.14);
  text-shadow:0 1px 0 #fff;
  transition:transform .1s ease,box-shadow .1s ease,background .1s ease;
}
.ws-cell.pick{ background:linear-gradient(160deg,#ffb48f,#ff7a45); color:#fff; text-shadow:0 1px 1px rgba(0,0,0,.35);
  transform:translateY(-3px); position:relative; z-index:2;
  box-shadow:0 3px 0 #b8451b,0 6px 10px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.45); }
.ws-cell.got{ background:linear-gradient(160deg,#c8f3e3,#8fe0c2);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.8),inset 0 -3px 0 rgba(0,90,60,.25); }
.ws-word{ background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.18));
  box-shadow:0 2px 0 rgba(0,0,0,.35); }

/* ---- Crossword: open squares raised, blocks sunk ---- */
.cw-board{ transform:perspective(1100px) rotateX(9deg); padding:3px; background:#0b2e26; }
.cw-grid{ gap:2px; background:#0a2620; border-color:#0a2620; }
.cw-cell{ background:#0a2620; box-shadow:inset 0 2px 4px rgba(0,0,0,.7); border-radius:2px; }
.cw-cell.open{
  background:linear-gradient(160deg,#ffffff,#eef2ee 60%,#dfe6e1); border-radius:3px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -2px 0 rgba(0,0,0,.16);
  transition:transform .12s ease,box-shadow .12s ease;
}
.cw-cell.in{ background:linear-gradient(160deg,#fff1e7,#fbd7c1); }
.cw-cell.cur{ background:linear-gradient(160deg,#ffc8ab,#ff9a6a); z-index:3;
  transform:translateY(-2px) scale(1.1);
  box-shadow:0 3px 0 #b8451b,0 6px 10px rgba(0,0,0,.45),inset 0 0 0 2px #d63d13; }

/* ---- keys everywhere press down into the table ---- */
.sud-key,.cw-key{
  background:linear-gradient(180deg,#2a4a41,#1b332d); color:#fff3e6;
  border:1px solid rgba(255,180,143,.35); border-radius:10px;
  box-shadow:0 4px 0 #0c1a17,0 7px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .08s ease,box-shadow .08s ease;
}
.cw-key{ background:linear-gradient(180deg,#ffffff,#e4ebe7); color:#16211e; border-color:#c9d3ce;
  box-shadow:0 4px 0 #9fb0aa,0 7px 10px rgba(0,0,0,.4),inset 0 1px 0 #fff; }
.cw-key.del{ background:linear-gradient(180deg,#ffe2d4,#ffc3a6); }
.sud-key:active,.cw-key:active,.cw-key.hit{ transform:translateY(4px);
  box-shadow:0 0 0 #0c1a17,0 2px 4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18); }

/* ---- Memory Match: thick cards on a tilted table, flipping in 3D ---- */
.mem-board{ transform:perspective(1000px) rotateX(18deg); transform-origin:50% 100%; perspective:900px;
  padding:12px; border-radius:14px;
  background:radial-gradient(ellipse at 50% 30%,#155a48,#0b3128 75%);
  box-shadow:0 2px 0 var(--slab-1),0 4px 0 var(--slab-2),0 6px 0 var(--slab-3),0 8px 0 var(--slab-4),
             0 10px 0 #051a15,0 30px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.06); }
.mem-inner{ transition:transform .55s cubic-bezier(.3,1.35,.45,1); }
.mem-card:not(.up):hover .mem-inner{ transform:translateY(-3px); }
.mem-face{ box-shadow:0 4px 0 rgba(0,0,0,.45),0 8px 12px rgba(0,0,0,.35); }
.mem-back{ background:
    linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0) 42%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 6px,rgba(255,255,255,0) 6px 12px),
    linear-gradient(160deg,#1a8f71,#0b5a47) !important;
  border:2px solid rgba(255,214,150,.55) !important; }
.mem-mark{ color:rgba(255,236,200,.9) !important; text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(255,200,120,.45); }
.mem-front{ background:linear-gradient(160deg,#ffffff,#eef3ef 60%,#dde6e0) !important;
  box-shadow:0 4px 0 #9fb0aa,0 8px 12px rgba(0,0,0,.35),inset 0 2px 0 #fff; }
.mem-card.pair .mem-front{ box-shadow:0 4px 0 #2e9e7a,0 0 18px rgba(63,191,151,.7),inset 0 2px 0 #fff; }

/* ---- Dish Scramble: wooden letter tiles on a rack ---- */
.scr-letters{ padding:12px 10px 16px; border-radius:10px;
  background:linear-gradient(180deg,#8a5a2e,#6b4220 60%,#5a361a);
  transform:perspective(900px) rotateX(16deg); transform-origin:50% 100%;
  box-shadow:0 3px 0 #4a2c14,0 6px 0 #3d2410,0 9px 0 #321d0c,0 22px 28px rgba(0,0,0,.55),
             inset 0 2px 0 rgba(255,220,170,.35); }
.scr-key{ background:linear-gradient(160deg,#fbe7c1,#efcf93 55%,#e1b774); color:#3a2410;
  border-radius:7px; font-weight:800; text-shadow:0 1px 0 rgba(255,255,255,.6);
  box-shadow:0 4px 0 #a8773a,0 7px 9px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform .1s ease,box-shadow .1s ease; }
.scr-key:active{ transform:translateY(4px); box-shadow:0 0 0 #a8773a,0 2px 4px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.7); }
.scr-key.used{ background:linear-gradient(160deg,#4a3322,#3a271a); color:#6d5642; text-shadow:none;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.6); transform:scale(.9); }
.scr-cell{ border-bottom:none; border-radius:7px;
  background:linear-gradient(180deg,#07211b,#0c2f27);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.08); }
.scr-cell.on{ background:linear-gradient(160deg,#fbe7c1,#efcf93 55%,#e1b774); color:#3a2410; font-weight:800;
  box-shadow:0 3px 0 #a8773a,0 6px 8px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.7); }

/* ---- Jackpot: a cabinet with depth, a chrome frame and a glossy knob ---- */
.slot-cab{ transform:perspective(1000px) rotateX(6deg); transform-origin:50% 100%; }
.slot-cab .spin-reels{
  box-shadow:0 0 0 3px #c9ced3,0 0 0 5px #7b8187,0 0 0 7px #d7dbdf,
             0 4px 0 7px #4d5358,0 9px 0 7px #34393d,0 26px 34px 6px rgba(0,0,0,.6),
             inset 0 0 18px rgba(0,0,0,.6) !important; }
.slot-lever .lv-knob{ background:radial-gradient(circle at 35% 30%,#ffd4c2 0%,#ff6a3a 30%,#c2330d 70%,#7a1d05 100%) !important;
  box-shadow:0 4px 8px rgba(0,0,0,.55),inset 0 -3px 5px rgba(0,0,0,.35) !important; }
.slot-lever .lv-arm{ background:linear-gradient(90deg,#8d9398,#f1f3f5 45%,#a9aeb3 60%,#5f656a) !important; }
.slot-lever .lv-base{ background:linear-gradient(180deg,#6f757a,#34393d) !important;
  box-shadow:0 4px 0 #202427,0 7px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3) !important; }

/* ---- Spin the Wheel: a thick gold rim, chasing bulbs, lit pointer ---- */
.wheel-disc{ box-shadow:0 0 0 5px #f6c451,0 0 0 8px #a8741c,0 5px 0 8px #6f4a0e,0 9px 0 8px #4d330a,
                        0 26px 36px 8px rgba(0,0,0,.6) !important; }
.wheel-stage::before{ content:''; position:absolute; top:-17px;right:-17px;bottom:-17px;left:-17px;inset:-17px; border-radius:50%; pointer-events:none; z-index:2;
  border:5px dotted #ffe7a0; animation:t3Glow 1.1s ease-in-out infinite; }
.wheel-stage.won::before{ animation:t3Glow .25s ease-in-out infinite; border-color:#fff3c4; }
.wheel-pointer{ filter:drop-shadow(0 4px 3px rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(255,200,110,.5)); }

@media (prefers-reduced-motion:reduce){
  .wheel-stage::before{ animation:none; }
  .mem-inner{ transition-duration:.01s; }
}

/* ---- when the 3D cabinet and wheel are running, the flat ones go invisible
   but stay in place underneath, still taking every touch ---- */
.slot-cab.s3d{ transform:none !important; padding:86px 16px 60px; }
.slot-cab.s3d .spin-reels,.slot-cab.s3d .slot-lever > *{ opacity:0 !important; }
.slot-cab.s3d .slot-lever:not(.off) .lv-knob{ animation:none; }
.p3d-canvas{ position:absolute; pointer-events:none; z-index:0; }
.wheel-stage.s3d{ margin-top:30px; margin-bottom:112px; }
.wheel-stage.s3d .wheel-disc,.wheel-stage.s3d .wheel-pointer{ opacity:0 !important; }
.wheel-stage.s3d::before,.wheel-stage.s3d::after{ display:none !important; }
/* ================= ROOM TO BREATHE ==========================================
   Spacing only - nothing here changes how any game plays. Every game gets a
   margin down each side of the phone, the small status lines become easy to
   read chips, and each 3D board gets clear space below its shadow before the
   next thing starts.                                                        */
#stage{ padding:0 14px 30px; box-sizing:border-box; }

/* status lines: Score, Found, Moves, Round - readable chips, not tiny text */
.g-hud,.mem-hud{ font-size:13px; align-items:center; gap:8px; margin:6px 0 18px; }
.g-hud > *,.mem-hud > *{ background:rgba(255,255,255,.05); border:1px solid rgba(239,78,34,.28);
  border-radius:999px; padding:4px 12px; line-height:1.4; }
.g-hud > *:empty,.mem-hud > *:empty{ display:none; }
.ws-status{ font-size:13px; text-align:center; margin:4px 0 18px; }

/* rows of pills: Easy/Medium/Hard, Slow/Normal/Fast, Check/Reveal/Clear */
#stage .pill-row{ margin-top:4px; margin-bottom:16px; gap:8px; }

/* ---- Sudoku ---- */
.sud-board{ max-width:min(100%,360px) !important; margin:10px auto 0 !important; }
.sud-pad{ margin-top:30px !important; gap:8px !important; max-width:min(100%,340px) !important; }
.sud-note{ margin-top:16px; }

/* ---- Word Search ---- */
.ws-board{ max-width:min(100%,360px) !important; }
.ws-list{ margin-top:28px !important; gap:8px !important; }

/* ---- Crossword: squares sized the way the game expects, space round it ---- */
.cw-grid{ gap:1px !important; }
.cw-cluebar{ margin-bottom:22px !important; }
.cw-board{ margin-left:auto !important; margin-right:auto !important; margin-bottom:26px !important; }
.cw-kb{ margin-top:6px; }
.cw-lists{ margin-top:26px !important; }

/* ---- Memory Match ---- */
.mem-board{ max-width:min(100%,330px) !important; margin:8px auto 30px !important; }

/* ---- Dish Scramble: every letter fits on one row of the rack ---- */
.scr-slot{ margin:6px 0 26px !important; gap:6px !important; }
.scr-letters{ gap:5px !important; padding:13px 8px 17px !important; }
.scr-key{ width:34px !important; height:42px !important; font-size:18px; }
.scr-back{ margin-top:22px !important; }

/* ---- Jackpot: the machine centred in its panel ---- */
.slot-cab.s3d{ max-width:300px; margin-left:auto !important; margin-right:auto !important;
  padding-left:30px !important; padding-right:8px !important; }   /* the lever hangs off the right: balance it */
.slot-hint{ margin-top:12px !important; }

/* ---- Wheel: a little smaller, clear of the edges and the guide button ---- */
.wheel-stage{ width:min(72vw,292px) !important; height:min(72vw,292px) !important; margin-top:52px !important; }
.wheel-msg{ margin-top:18px !important; }

/* ---- Highway Run ---- */
.g-hr .sn-speeds{ margin-bottom:12px; }
.hr-pad{ margin-top:18px !important; }

/* ---- Jackpot's panel becomes a dark stage for the black-and-gold cabinet ---- */
.g-spin:has(.slot-cab.s3d){ background:radial-gradient(ellipse at 50% 28%,#2b1510 0%,#120b09 55%,#080808 100%) !important;
  border:1px solid rgba(242,189,69,.35) !important; box-shadow:0 0 0 1px rgba(0,0,0,.6),0 18px 40px rgba(0,0,0,.55) !important; }
</style>
</head>

<script>
/* ===================== visual effects ===================== */
var FX = (function(){
  function shake(){
    document.body.classList.remove('fx-shake');
    void document.body.offsetWidth;
    document.body.classList.add('fx-shake');
    setTimeout(function(){ document.body.classList.remove('fx-shake'); }, 420);
  }
  function confetti(n){
    n = n || 70;
    var cv = document.createElement('canvas');
    cv.className = 'fx-confetti';
    var w = cv.width = window.innerWidth, h = cv.height = window.innerHeight;
    document.body.appendChild(cv);
    var g = cv.getContext('2d');
    if(!g){ cv.remove(); return; }
    var colors = ['#ef4e22','#ff8a5c','#0f4b3f','#2ea88b','#ef4e22','#eef4f1'];
    var parts = [];
    for(var i=0;i<n;i++){
      parts.push({
        x: Math.random()*w, y: -20 - Math.random()*h*0.5,
        vx: (Math.random()-0.5)*3.2, vy: 2.5 + Math.random()*3,
        rot: Math.random()*Math.PI*2, vr: (Math.random()-0.5)*0.35,
        size: 5 + Math.random()*6, color: colors[i % colors.length]
      });
    }
    var start = Date.now();
    function frame(){
      var t = Date.now() - start;
      g.clearRect(0,0,w,h);
      parts.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.rot += p.vr;
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
        g.fillStyle = p.color;
        g.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.6);
        g.restore();
      });
      if(t < 2200 && cv.parentNode){ requestAnimationFrame(frame); }
      else { cv.remove(); }
    }
    requestAnimationFrame(frame);
  }
  return { shake: shake, confetti: confetti };
})();

/* ===================== sound effects ===================== */
var SFX = (function(){
  /* Everything goes through one bus: a master gain, then a gentle compressor.
     Before this, each sound connected straight to the speakers, so two
     landing together clipped and crackled - which happens constantly in the
     slot machine. The compressor also lets the quiet sounds sit lower
     without vanishing on a phone speaker.

     There is a small reverb on a send. It is a generated impulse, not a
     file, so it costs nothing to ship and gives the win sounds somewhere to
     ring out instead of stopping dead. */
  var actx = null, enabled = true, bus = null, wet = null;

  function ac(){
    if(!actx){
      try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
      if(actx) build();
    }
    if(actx && actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
    return actx;
  }
  function build(){
    var c = actx;
    var comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 26;
    comp.ratio.value = 6; comp.attack.value = 0.004; comp.release.value = 0.18;
    bus = c.createGain(); bus.gain.value = 0.9;
    bus.connect(comp); comp.connect(c.destination);

    // a short, dark room built from decaying noise
    try{
      var len = Math.floor(c.sampleRate * 1.1);
      var imp = c.createBuffer(2, len, c.sampleRate);
      for(var ch=0; ch<2; ch++){
        var d = imp.getChannelData(ch);
        for(var i=0;i<len;i++){
          d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6);
        }
      }
      var conv = c.createConvolver(); conv.buffer = imp;
      var damp = c.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=2600;
      wet = c.createGain(); wet.gain.value = 0.0;
      wet.connect(conv); conv.connect(damp); damp.connect(bus);
    }catch(e){ wet = null; }
  }
  /* Sounds can sit left, centre or right. The three reels each clunk from
     their own side of the machine, which is most of what makes it sound
     like a cabinet in front of you rather than beeps from a phone. */
  function out(node, send, pan){
    var src = node;
    if(pan && actx.createStereoPanner){
      var p = actx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan));
      node.connect(p); src = p;
    }
    src.connect(bus);
    if(wet && send){
      var s = actx.createGain(); s.gain.value = send;
      src.connect(s); s.connect(wet);
    }
  }
  /* Nothing in a real machine sounds exactly the same twice. A few cents of
     pitch and a few percent of level, different every time, is the
     difference between a mechanism and a sample on loop. */
  function vary(amount){ return (Math.random() * 2 - 1) * amount; }

  /* One shared second of noise, cut from at a random point for each click,
     instead of building a fresh buffer every time. A slot reel asks for
     sixty clicks a second - allocating each one made cheap phones stutter,
     in the sound and in the animation alike. */
  var noiseBuf = null;
  function noiseBuffer(c){
    if(noiseBuf) return noiseBuf;

    var t0 = c.currentTime + (opts.delay || 0);
    var vol = (opts.vol != null ? opts.vol : 0.16) * (1 + vary(opts.still ? 0 : 0.07));

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

/* ---------------- the guest's day pass ----------------
   A QR scan at the bench buys one person one shot at a reward, and that
   shot lasts until midnight. At 00:00 everybody starts fresh.

   The pass remembers four things: which of the two prize games this guest
   was dealt, whether they have watched the opening film, how many pulls
   they have spent and what came of it. Nobody is dealt both prize games -
   one reward game per guest, per day.

   WHERE THE TRUTH LIVES
   The server owns the pass. It computes the day in the
   restaurant's own timezone, keeps one record per device per day, and runs
   the draw itself, so no amount of clearing storage or switching browsers
   buys a second go. The three local stores below become a cache.

   If the server cannot be reached the page still works, but the lock is only as good as
   one browser's storage: a different browser or a private window starts
   fresh. See mile17-pass-worker.js to turn the server on. */

   the arcade calls /pass on its own address - no cross-origin request, nothing
   to paste in. Only set this if you ever split them onto separate addresses. */

/* PREVIEW
   Off for anything a customer touches. On, every lock comes off so the whole
   thing can be walked through end to end: the opening film plays on every
   load, both prize games sit on the hub, nothing is written to storage or
   the server, and a small bar appears for dealing a game and forcing a win
   or a miss. Two builds ship from this one file - the live one with this
   false, the review copy with it true. */
var PREVIEW = false;

var PV = (function(){
  if(!PREVIEW) return null;
  var d = { game:'', outcome:'draw' };            // outcome: draw | win | lose
  try{
    var raw = JSON.parse(sessionStorage.getItem('mw17_pv') || '{}');
    for(var k in raw) if(raw.hasOwnProperty(k)) d[k] = raw[k];
  }catch(e){}
  return {
    get: function(k){ return d[k]; },
    set: function(k, v){
      d[k] = v;
      try{ sessionStorage.setItem('mw17_pv', JSON.stringify(d)); }catch(e){}
      location.href = location.pathname + location.search;
    }
  };
})();

      for(var j=0;j<16;j++) id += ('0' + bytes[j].toString(36)).slice(-2);
      id = id.slice(0, 29);
    }
    try{ localStorage.setItem(KEY, id); }catch(e){}
    try{ document.cookie = 'mw17guest=' + id + ';path=/;max-age=' + (400*24*3600) + ';SameSite=Lax'; }catch(e){}
    return id;
  }

  function live(r){ return !!(r && r.day && r.day === dayKey()); }

  /* ---- the three local stores ---- */
  function lsGet(){ try{ return JSON.parse(localStorage.getItem(LSK) || 'null'); }catch(e){ return null; } }
  function lsPut(r){ try{ localStorage.setItem(LSK, JSON.stringify(r)); }catch(e){} }
  function ckGet(){
    try{
      var m = document.cookie.match(new RegExp('(?:^|; )' + CKK + '=([^;]*)'));
      return m ? JSON.parse(decodeURIComponent(m[1])) : null;
    }catch(e){ return null; }
  }
  function ckPut(r){
    try{
      document.cookie = CKK + '=' + encodeURIComponent(JSON.stringify(r)) +
        ';path=/;max-age=' + (400*24*3600) + ';SameSite=Lax';
    }catch(e){}
  }
  function idbOpen(){
    return new Promise(function(res, rej){
      if(!window.indexedDB) return rej();
      var q = indexedDB.open(DBN, 1);
      q.onupgradeneeded = function(){ try{ q.result.createObjectStore(DBS); }catch(e){} };
      q.onsuccess = function(){ res(q.result); };
      q.onerror   = function(){ rej(q.error); };
    });
  }
  function idbGet(){
    return idbOpen().then(function(db){
      return new Promise(function(res){
        try{
          var q = db.transaction(DBS,'readonly').objectStore(DBS).get('rec');
          q.onsuccess = function(){ res(q.result || null); };
          q.onerror   = function(){ res(null); };
        }catch(e){ res(null); }
      });
    }).catch(function(){ return null; });
  }
  function idbPut(r){
    return idbOpen().then(function(db){
      return new Promise(function(res){
        try{
          var q = db.transaction(DBS,'readwrite').objectStore(DBS).put(r,'rec');
          q.onsuccess = function(){ res(true); };
          q.onerror   = function(){ res(false); };
        }catch(e){ res(false); }
      });
    }).catch(function(){});

  function persist(){ if(PREVIEW || !rec) return; lsPut(rec); ckPut(rec); idbPut(rec); }

  /* When the stores disagree, take the answer that gives the guest less. */
  function merge(found){
    var ok = found.filter(live);
    if(!ok.length) return null;
    var out = null;
    ok.forEach(function(r){
      if(!out){
        out = { day:r.day, game:r.game, intro:!!r.intro, tries:r.tries || 1,
                spent:r.spent || 0, winOn:(typeof r.winOn === 'number' ? r.winOn : null),
                won:!!r.won, code:r.code || null };
        return;
      }
      out.intro = out.intro || !!r.intro;
      out.game  = out.game || r.game;
      out.spent = Math.max(out.spent, r.spent || 0);
      if(typeof out.winOn !== 'number' && typeof r.winOn === 'number') out.winOn = r.winOn;
      if(r.won){ out.won = true; out.code = out.code || r.code || null; }
    });
    if(PRIZE_GAMES.indexOf(out.game) < 0) out.game = null;
    out.tries = TRIES[out.game] || 1;
    return out;
  }
  function fresh(){
    var game  = PRIZE_GAMES[Math.floor(Math.random() * PRIZE_GAMES.length)];
    var tries, wins;
    if(PREVIEW){
      if(PV.get('game')) game = PV.get('game');
      tries = TRIES[game] || 1;
      var o = PV.get('outcome');
      wins = o === 'win' ? true : (o === 'lose' ? false : Math.floor(Math.random() * ODDS) === 0);
      return { day: dayKey(), game: game, intro: false, tries: tries, spent: 0,
               winOn: wins ? Math.floor(Math.random() * tries) : null, won: false, code: null };
    }
    tries = TRIES[game] || 1;
    wins  = Math.floor(Math.random() * ODDS) === 0;
    return { day: dayKey(), game: game, intro: false, tries: tries, spent: 0,
             winOn: wins ? Math.floor(Math.random() * tries) : null,
             won: false, code: null };
  }
  function makeCode(table){
    var ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', c = '';
    for(var i=0;i<4;i++) c += ch[Math.floor(Math.random()*ch.length)];
    var t = String(table||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,3);
    return 'MWP-R' + (t ? t + '-' : '') + c;
  }

  /* ---- the server, when there is one ---- */
  function api(action, extra, ms){
    if(PREVIEW) return Promise.resolve(null);
    var body = { action:action, device:dev, browser:brw };
    if(extra && extra.key) body.key = extra.key;
    for(var k in extra) if(extra.hasOwnProperty(k)) body[k] = extra[k];
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function(){ if(ctrl) ctrl.abort(); }, ms || 3500);
    return fetch((PASS_API || '').replace(/\/$/,'') + '/pass', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined
    }).then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; })
      .then(function(j){ clearTimeout(t); online = !!j; return j; });
  }

  function adopt(server){
    // The server's word beats anything cached here.
    rec = { day: server.day, game: server.game, intro: !!server.intro,
            tries: server.tries, spent: server.spent,
            winOn: (typeof server.winOn === 'number' ? server.winOn : null),
            won: !!server.won, code: server.code || null };
    persist();
  }

  function finish(found, server){
    if(server && server.ok){ adopt(server); }
    else {
      rec = merge(found) || fresh();
      if(!rec.game){ var f = fresh(); rec.game = f.game; rec.tries = f.tries; rec.winOn = f.winOn; }
      if(!rec.tries) rec.tries = TRIES[rec.game] || 1;
      if(typeof rec.spent !== 'number') rec.spent = 0;
      persist();
    }
    hydrated = true;
    var fns = waiting.splice(0);
    setTimeout(function(){ fns.forEach(function(fn){ try{ fn(); }catch(e){} }); }, 0);
  }

  return {
    ready: function(cb){
      if(hydrated){ setTimeout(cb, 0); return; }
      waiting.push(cb);
      if(waiting.length > 1) return;
      /* Who has had their go is decided by a private random ID made the
         first time this browser opens the arcade - not by reading the phone.
         Reading the phone could not tell two phones of the same model apart
         (every iPhone calls its chip "Apple GPU"; many Android phones share
         a screen, memory and chip), so real guests who had never played
         were told their go was spent. A random ID is never shared by two
         guests. It is kept in three places, like the pass itself. */
      dev = guestId();

      // from the same phone - opened with empty storage - from a new guest.
      try{ brw = prints().device; }catch(e){ brw = dev; }

      if(PREVIEW){ finish([], null); return; }    // nothing remembered, nothing locked

      /* Staff reset: open the arcade with ?staff=<RESET_KEY> and this one
         device starts today fresh - film, prize game and all. The password
         is checked by the server, never by the page, so a guest who guesses
         at it gets nothing: the local copy is only cleared once the server
         has confirmed the reset. The password is then taken out of the
         address bar so it is not left on the screen or in history. */
      var staffKey = null;
      try{ staffKey = new URLSearchParams(location.search).get('staff'); }catch(e){}
      if(staffKey){
        try{
          var q = new URLSearchParams(location.search); q.delete('staff');

        }catch(e){}

        });

      }
      load();
      function load(){

      function done(async, server){

        idbGet(),
        api('open', {})
      ]).then(function(r){ done(r[0], r[1]); },
              function(){ done(null, null); });
